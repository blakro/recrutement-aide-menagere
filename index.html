<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Entretien aide ménagère — Niamey</title>
<style>
:root{
  --fond:#faf6f0; --surface:#ffffff; --surface-douce:#f4efe7;
  --encre:#1c1917; --encre-douce:#57514b;
  --trait:#ddd2c2; --trait-fort:#a89780;
  --primaire:#1f4f8f; --primaire-sombre:#153a6d; --primaire-pale:#e7eefa;
  --sable:#c9832b; --sable-pale:#fbf0dc;
  --vert:#15603a; --vert-pale:#e2f2e8;
  --orange:#9a5410; --orange-pale:#fcefdd;
  --rouge:#96111a; --rouge-pale:#fceaea;
  --t:var(--primaire); --t-pale:var(--primaire-pale);
  --rayon:16px; --rayon-petit:11px;
  --bord:2px;
  --ombre:0 1px 2px rgba(60,40,20,.06), 0 8px 20px rgba(60,40,20,.08);
  --ombre-douce:0 1px 3px rgba(60,40,20,.08);
  --base:17px;
}
[data-theme=indigo]   {--t:#33539e;--t-pale:#e9edf9}
[data-theme=violet]   {--t:#6b4ea8;--t-pale:#efe9fa}
[data-theme=turquoise]{--t:#0e7a72;--t-pale:#e0f4f1}
[data-theme=brique]   {--t:#b34524;--t-pale:#fbe9e3}
[data-theme=ocre]     {--t:#8d6114;--t-pale:#faf0dd}
[data-theme=foret]    {--t:#2a6e46;--t-pale:#e4f2e9}
[data-theme=prune]    {--t:#8d3a63;--t-pale:#f9e7f0}
[data-theme=ardoise]  {--t:#3f6483;--t-pale:#e8f0f6}
[data-theme=orange]   {--t:#a85c18;--t-pale:#fceede}
[data-theme=bleu]     {--t:#1f5aa8;--t-pale:#e6eefa}

html[data-contraste=fort]{
  --fond:#ffffff; --surface:#ffffff; --surface-douce:#ffffff;
  --encre:#000000; --encre-douce:#1c1917;
  --trait:#000000; --trait-fort:#000000;
  --primaire:#00316f; --primaire-pale:#dbe8fa;
  --vert:#04471c; --orange:#6d3a00; --rouge:#7d0d14;
  --bord:3px; --ombre:none; --ombre-douce:none; --base:20px;
}
html[data-contraste=fort] [data-theme]{--t-pale:#ffffff}
html[data-contraste=fort] body{background-image:none}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--fond); color:var(--encre);
  background-image:radial-gradient(circle at 1px 1px, rgba(140,110,70,.10) 1px, transparent 0);
  background-size:20px 20px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--base); line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
.enveloppe{max-width:760px;margin:0 auto;padding:14px 16px 122px}
h1{font-size:1.5rem;line-height:1.15;margin:.1em 0 .5em;letter-spacing:-.02em}
h2{font-size:1.18rem;margin:1.5em 0 .5em;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
h3{font-size:1.02rem;margin:0 0 .5em}
p{margin:.55em 0}
small,.petit{font-size:.84rem;color:var(--encre-douce);line-height:1.4}

/* ---- Bandeau ---- */
.bandeau{
  color:#fff;border-bottom:4px solid var(--sable);
  background:linear-gradient(135deg,#1f4f8f 0%,#153a6d 60%,#15325e 100%);
}
.bandeau .dedans{max-width:760px;margin:0 auto;padding:9px 16px;display:flex;gap:10px;align-items:center}
.bandeau .marque{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.3)}
.bandeau .marque svg{width:21px;height:21px}
.bandeau .titre{flex:1 1 auto;min-width:0}
.bandeau .titre b{display:block;font-size:.95rem;line-height:1.2}
.bandeau .titre span{display:block;font-size:.74rem;line-height:1.25;color:#d7e3f3}
.soleil{flex:0 0 auto;background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.5);
  border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:700;white-space:nowrap}
html[data-contraste=fort] .soleil{background:#fff;color:#00316f;border-color:#fff}

/* ---- Blocs ---- */
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:var(--rayon);
  padding:15px;margin:13px 0;box-shadow:var(--ombre-douce)}
html[data-contraste=fort] .carte{border-width:2px}
.carte.plate{box-shadow:none;background:var(--surface-douce)}
.carte.teintee{background:var(--t-pale);border-color:var(--t)}
.encadre{border-left:6px solid var(--sable);background:var(--sable-pale);color:#402b09;
  border-radius:var(--rayon-petit);padding:12px 14px;margin:13px 0;font-size:.95rem}
.encadre b{color:#8a5a10}
.encadre.info{border-left-color:var(--primaire);background:var(--primaire-pale);color:#122c52}
.encadre.info b{color:var(--primaire)}
.consigne{background:var(--surface-douce);border:1px dashed var(--trait-fort);border-radius:var(--rayon-petit);
  padding:11px 13px;font-size:.9rem;margin:.7em 0}
.enonce{font-size:1.3rem;font-weight:700;line-height:1.28;margin:.35em 0 .65em;letter-spacing:-.015em}

/* ---- Pictogrammes ---- */
.pic{width:1.15em;height:1.15em;flex:0 0 auto;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.medaillon{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:var(--surface);
  border:2px solid var(--t);color:var(--t);display:flex;align-items:center;justify-content:center}
.medaillon .pic{width:25px;height:25px;stroke-width:1.9}
.medaillon.petit{width:34px;height:34px;border-radius:10px}
.medaillon.petit .pic{width:19px;height:19px}

/* ---- En-tête de question ---- */
.entete-question{display:flex;gap:13px;align-items:center;background:var(--t-pale);
  border:1px solid var(--t);border-left-width:6px;border-radius:var(--rayon);padding:12px 14px;margin:6px 0 14px}
.entete-question .infos{min-width:0}
.entete-question .rang{display:block;font-size:.76rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.07em;color:var(--t)}
.entete-question .titre{display:block;font-size:1.06rem;font-weight:800;line-height:1.2}
.entete-question .sujet{display:block;font-size:.85rem;color:var(--encre-douce);margin-top:2px}

/* ---- Illustration ---- */
.illustration{display:block;width:100%;height:auto;border-radius:var(--rayon);border:1px solid var(--trait);
  box-shadow:var(--ombre-douce)}
html[data-contraste=fort] .illustration{display:none}

/* ---- Formulaires ---- */
label.champ{display:block;font-weight:700;margin:.95em 0 .3em;font-size:.95rem}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;padding:13px;
  border:var(--bord) solid var(--trait-fort);border-radius:var(--rayon-petit);background:var(--surface);color:var(--encre)}
textarea{min-height:80px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,label.option:focus-within{
  outline:3px solid var(--primaire);outline-offset:2px}

/* ---- Boutons ---- */
button{font:inherit;cursor:pointer}
.bouton{display:block;width:100%;padding:15px 16px;margin:10px 0;border-radius:var(--rayon-petit);
  border:var(--bord) solid var(--primaire);background:var(--primaire);color:#fff;
  font-weight:700;font-size:1rem;text-align:center;text-decoration:none;box-shadow:var(--ombre-douce)}
.bouton:active{transform:translateY(1px)}
.bouton.secondaire{background:var(--surface);color:var(--primaire)}
.bouton.danger{background:var(--surface);color:var(--rouge);border-color:var(--rouge)}
.bouton.petit{padding:10px 12px;font-size:.9rem;margin:6px 0}
.bouton.avecPic{display:flex;align-items:center;justify-content:center;gap:9px}
.bouton:disabled{opacity:.4;cursor:not-allowed}
.rangee{display:flex;gap:10px;flex-wrap:wrap}
.rangee>*{flex:1 1 130px;width:auto;margin:6px 0}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---- Options ---- */
.options{margin:.5em 0}
.option{display:flex;gap:12px;align-items:flex-start;position:relative;
  border:var(--bord) solid var(--trait);border-radius:var(--rayon-petit);
  padding:14px 14px 14px 12px;margin:9px 0;background:var(--surface);cursor:pointer;box-shadow:var(--ombre-douce)}
.option:has(input:checked){border-color:var(--t);background:var(--t-pale);box-shadow:inset 5px 0 0 var(--t)}
.option input{position:absolute;opacity:0;width:1px;height:1px}
.marque{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border:var(--bord) solid var(--trait-fort);
  background:var(--surface);display:flex;align-items:center;justify-content:center}
.option input[type=radio]+.marque{border-radius:50%}
.option input[type=checkbox]+.marque{border-radius:7px}
.marque::after{content:"";width:12px;height:12px;border-radius:inherit;background:transparent}
.option input:checked+.marque{border-color:var(--t)}
.option input:checked+.marque::after{background:var(--t)}
.option input[type=checkbox]:checked+.marque::after{width:14px;height:8px;border-radius:0;background:transparent;
  border-left:3px solid var(--t);border-bottom:3px solid var(--t);transform:rotate(-45deg) translate(1px,-2px)}
.option .texte{flex:1;min-width:0;font-weight:600;line-height:1.35}
.option .sous{display:block;font-size:.86rem;color:var(--encre-douce);font-weight:400;margin-top:3px}
.option .note{display:block;font-size:.8rem;color:var(--orange);font-weight:700;margin-top:4px}

/* ---- Progression ---- */
.pastilles{display:flex;gap:5px;margin:4px 0 10px}
.pastille{flex:1;height:11px;border-radius:999px;background:#e3d9c9;border:1px solid transparent;padding:0;min-width:0}
.pastille.complet{background:var(--primaire)}
.pastille.partiel{background:var(--sable)}
.pastille.courant{border-color:var(--encre);box-shadow:0 0 0 2px var(--fond),0 0 0 4px var(--encre)}
.fil{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.86rem;color:var(--encre-douce)}
.fil b{color:var(--encre);font-size:.95rem}

/* ---- Barre basse ---- */
.barre-bas{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:var(--bord) solid var(--trait);box-shadow:0 -4px 18px rgba(60,40,20,.10)}
.barre-bas .dedans{max-width:760px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.barre-bas .rangee>*{margin:0;flex:1 1 84px}
.barre-bas .bouton{margin:0;padding:15px 6px;font-size:.93rem}

/* ---- Résultat ---- */
.hero{border-radius:var(--rayon);padding:18px 16px;margin:6px 0 14px;color:#fff;
  background:linear-gradient(135deg,#1f4f8f,#153a6d);box-shadow:var(--ombre)}
.hero.essai{background:linear-gradient(135deg,#1b7a45,#12522f)}
.hero.approfondir{background:linear-gradient(135deg,#b97514,#8a5410)}
.hero.non_recommande{background:linear-gradient(135deg,#a8202a,#7a0f16)}
.hero .dedans{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .texte{flex:1 1 170px;min-width:0}
.hero .verdict-titre{font-size:1.25rem;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:9px}
.hero .verdict-detail{font-size:.88rem;margin-top:6px;color:rgba(255,255,255,.92)}
.hero .qui{font-size:.8rem;color:rgba(255,255,255,.8);margin-bottom:8px}
html[data-contraste=fort] .hero{background:#fff;color:#000;border:3px solid #000}
html[data-contraste=fort] .hero .verdict-detail,html[data-contraste=fort] .hero .qui{color:#1c1917}
.anneau{flex:0 0 auto}
.anneau .valeur{font-size:30px;font-weight:800;fill:currentColor}
.anneau .sur{font-size:11px;fill:currentColor;opacity:.82;font-weight:600}

.sous-score{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--trait)}
.sous-score:last-child{border-bottom:0}
.sous-score .corps{flex:1;min-width:0}
.sous-score .ligne{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.98rem}
.sous-score .ligne em{font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--t)}
.sous-score .resume{display:block;font-size:.82rem;color:var(--encre-douce);margin-top:2px}
.jauge{height:11px;background:#e3d9c9;border-radius:999px;overflow:hidden;margin-top:7px;border:1px solid var(--trait)}
.jauge i{display:block;height:100%;border-radius:999px;background:var(--t)}

.drapeau{border-radius:var(--rayon-petit);padding:13px 14px;margin:10px 0;border:var(--bord) solid;display:flex;gap:12px;box-shadow:var(--ombre-douce)}
.drapeau .pic{width:26px;height:26px;stroke-width:1.9;margin-top:1px}
.drapeau.bloquant{background:var(--rouge-pale);border-color:var(--rouge);color:var(--rouge)}
.drapeau.leger{background:var(--orange-pale);border-color:var(--orange);color:var(--orange)}
.etiquette{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 9px;border-radius:999px;border:1.5px solid currentColor}
.drapeau .message{display:block;margin-top:6px;font-weight:600;line-height:1.38;color:var(--encre)}

ul.verifs{list-style:none;padding:0;margin:.4em 0}
ul.verifs li{position:relative;padding:11px 0 11px 34px;border-bottom:1px solid var(--trait);line-height:1.4}
ul.verifs li:last-child{border-bottom:0}
ul.verifs li::before{content:"";position:absolute;left:2px;top:13px;width:18px;height:18px;
  border:2px solid var(--trait-fort);border-radius:5px;background:var(--surface)}
.detail-reponses summary{cursor:pointer;font-weight:700;color:var(--primaire);padding:10px 0}
.detail-reponses dl{margin:0}
.detail-reponses dt{font-weight:700;font-size:.93rem;margin-top:15px;display:flex;gap:8px;align-items:center;color:var(--t)}
.detail-reponses dd{margin:3px 0 0;color:var(--encre);font-size:.92rem;padding-left:26px}
.detail-reponses .sujet{display:block;font-size:.8rem;color:var(--encre-douce);font-weight:400}

table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6em 0}
th,td{border:1px solid var(--trait);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--surface-douce);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}

.liste{list-style:none;padding:0;margin:0}
.liste li{border:var(--bord) solid var(--trait);border-radius:var(--rayon-petit);padding:13px;margin:10px 0;
  background:var(--surface);box-shadow:var(--ombre-douce)}
.liste.sommaire li{border:0;padding:0;margin:9px 0;background:none;box-shadow:none}
.liste.sommaire .bouton{display:flex;align-items:center;gap:11px;text-align:left;padding:12px 13px;
  border-color:var(--t);color:var(--encre)}
.liste.sommaire .bouton .infos{flex:1;min-width:0}
.liste.sommaire .bouton b{display:block;font-size:.97rem;line-height:1.2}
.liste.sommaire .bouton .sujet{display:block;font-size:.78rem;color:var(--encre-douce);font-weight:400;margin-top:2px}
.chip{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;
  border:1.5px solid;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.chip.essai{color:var(--vert);border-color:var(--vert);background:var(--vert-pale)}
.chip.approfondir{color:var(--orange);border-color:var(--orange);background:var(--orange-pale)}
.chip.non_recommande{color:var(--rouge);border-color:var(--rouge);background:var(--rouge-pale)}
.chip.vide{color:var(--encre-douce);border-color:var(--trait-fort);background:var(--surface-douce)}
.chip.complet{color:var(--vert);border-color:var(--vert);background:var(--vert-pale)}
.chip.partiel{color:var(--orange);border-color:var(--orange);background:var(--orange-pale)}

pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-douce);padding:10px;border-radius:8px;font-size:.8rem}
.ok{color:var(--vert);font-weight:800}
.ko{color:var(--rouge);font-weight:800}

@media (min-width:640px){ :root{--base:18px} .enveloppe{padding:20px 20px 122px} }

@media print{
  .bandeau,.barre-bas,.sansImpression{display:none !important}
  body{font-size:11pt;background:#fff;background-image:none}
  .enveloppe{max-width:none;padding:0}
  .carte,.drapeau,.hero,.sous-score{break-inside:avoid;box-shadow:none}
  .carte{border:1px solid #999}
  .hero{background:#fff !important;color:#000;border:2px solid #333}
  .hero .verdict-detail,.hero .qui{color:#333}
  .anneau .valeur{fill:#000}.anneau .sur{fill:#333}
  .detail-reponses summary{display:none}
  h2{margin-top:14pt}
  a[href]:after{content:""}
}
</style>
</head>
<body>
<header class="bandeau sansImpression">
  <div class="dedans">
    <span class="marque" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 11 12 4l8.6 7"/><path d="M5.6 9.5V20h12.8V9.5"/><path d="M9.9 20v-5.2h4.2V20"/></svg></span>
    <div class="titre">
      <b>Entretien aide ménagère</b>
      <span>Aide à la décision, pas un détecteur de mensonge.</span>
    </div>
    <button class="soleil" id="soleil" type="button" aria-pressed="false">☀ Plein soleil</button>
  </div>
</header>
<main class="enveloppe" id="ecran"></main>
<div class="barre-bas sansImpression" id="barre"></div>
<script>
// @@SCORING-START
/* Barème de l'entretien — bloc pur (aucun accès au navigateur ni au stockage).
   Contrat : docs/SPEC.md § 8. Contenu validé : docs/QUESTIONS.md.

   Entrée lue par computeScore, et rien d'autre :
   {
     poste: 'menage' | 'cuisine' | 'polyvalent',
     reponses: {
       q1:  { familles: ['f_menage', 'f_lessive', ...] },
       q2:  { famille: 'f_cuisine' | null, tache: 'texte libre' | null, option: 'precise' | ... },
       q3:  { mains: 'complet' | ..., legumes: ..., viande: ..., restes: ..., eau: ... },
       q4:  { variante: 'huile' | 'gaz' | 'melange', option: '...' },
       q5:  { option: '...' },
       q6:  { variante: 'argent' | 'objet' | 'nourriture', option: '...' },
       q7:  { option: '...' },
       q8:  { option: '...' },
       q9:  { premiereExperience: false, dureeDernier: '...', motifDernier: '...',
              dureeAvantDernier: '...', reference: '...' },
       q10: { duree: '...', conges: '...', calendrier: '...', coherence: '...' }
     },
     pratique: { g1: 'reussi' | 'partiel' | 'non_fait' | 'non_observe', ... }   // facultatif
   }

   Les renseignements d'état civil saisis à l'écran ne sont jamais transmis ici : ni la situation
   de famille, ni l'origine, ni la croyance, ni la langue de l'entretien n'entrent dans le score. */

const CONFIG = {
  version: '1.0.0',

  postes: [
    { id: 'menage', libelle: 'Aide ménagère' },
    { id: 'cuisine', libelle: 'Aide cuisinière' },
    { id: 'polyvalent', libelle: 'Polyvalente (les deux)' }
  ],

  sousScores: [
    { id: 'competences', libelle: 'Compétences', couleur: 'indigo', icone: 'liste',
      resume: "Ce qu’elle sait vraiment faire, une fois vérifié." },
    { id: 'hygieneSecurite', libelle: 'Hygiène & sécurité', couleur: 'turquoise', icone: 'bouclier',
      resume: "Sa façon de traiter la nourriture, l’eau, le feu et les produits." },
    { id: 'integrite', libelle: 'Intégrité', couleur: 'foret', icone: 'coeur',
      resume: "Son honnêteté et son respect des règles de la maison." },
    { id: 'coherence', libelle: 'Cohérence', couleur: 'prune', icone: 'balance',
      resume: "L’accord entre ce qu’elle annonce et ce qu’elle montre." },
    { id: 'stabilite', libelle: 'Stabilité', couleur: 'orange', icone: 'ancre',
      resume: "Ce que son parcours dit de sa façon de rester en poste." }
  ],

  // SPEC § 5 — chaque poste totalise 100.
  ponderations: {
    menage:     { competences: 25, hygieneSecurite: 20, integrite: 25, coherence: 15, stabilite: 15 },
    cuisine:    { competences: 25, hygieneSecurite: 30, integrite: 20, coherence: 15, stabilite: 10 },
    polyvalent: { competences: 25, hygieneSecurite: 25, integrite: 20, coherence: 15, stabilite: 15 }
  },

  seuils: { essai: 70, approfondir: 50 },

  plafonnement: { bloquantsNonRecommande: 2, legersApprofondir: 3 },

  // Valeur d'un sous-score dont aucune question n'a été posée.
  neutre: 50,

  // Toujours rappelés, quel que soit le résultat.

/* Calcul du score. Fonction pure : mêmes entrées, même sortie.
   Sortie : { total, sousScores, drapeaux, verdict, pointsAVerifier } — voir docs/SPEC.md § 8. */
function computeScore(answers, config) {
  const entree = answers || {};
  const ponderations = config.ponderations || {};
  const poste = ponderations[entree.poste] ? entree.poste : 'polyvalent';
  const reponses = entree.reponses || {};
  const gestesSaisis = entree.pratique || {};

  const acc = {};
  config.sousScores.forEach(function (s) { acc[s.id] = { obtenus: 0, max: 0 }; });
  const drapeaux = [];
  const pointsAVerifier = [];

  function ajouterVerif(texte) {
    if (texte && pointsAVerifier.indexOf(texte) === -1) pointsAVerifier.push(texte);
  }

  // Un barème peut valoir un nombre, ou un nombre par poste. null = hors périmètre du poste.
  function resoudre(valeur) {
    if (typeof valeur === 'number') return valeur;
    if (valeur && typeof valeur === 'object') {
      const v = valeur[poste];
      return typeof v === 'number' ? v : null;
    }
    return null;
  }

  function ajouterDrapeau(drapeau, contexte) {
    if (!drapeau) return;
    const dico = (config.drapeaux || {})[drapeau.id] || {};
    const base = dico[drapeau.niveau] || drapeau.id;
    drapeaux.push({
      id: drapeau.id,
      niveau: drapeau.niveau,
      message: contexte ? base + ' Point concerné : ' + contexte + '.' : base
    });
  }

  /* Un critère = une série d'options concurrentes dont une seule est retenue.
     Le maximum applicable est le meilleur score possible du critère ; une option marquée
     « nonPosee » retire le critère du maximum, sans pénaliser la candidate. */
  function appliquerCritere(critere, optionId, contexte) {
    if (!critere) return null;
    const options = critere.options || [];
    let choisie = null;
    options.forEach(function (o) { if (o.id === optionId) choisie = o; });
    if (!choisie || choisie.nonPosee) return null;

    const cles = {};
    options.forEach(function (o) {
      if (o.nonPosee || !o.points) return;
      Object.keys(o.points).forEach(function (k) { cles[k] = true; });
    });

    let auMaximum = true;
    Object.keys(cles).forEach(function (k) {
      if (!acc[k]) return;
      let max = 0;
      options.forEach(function (o) {
        if (o.nonPosee) return;
        const v = resoudre(o.points ? o.points[k] : null);
        if (v !== null && v > max) max = v;
      });
      const obtenu = resoudre(choisie.points ? choisie.points[k] : null) || 0;
      acc[k].max += max;
      acc[k].obtenus += obtenu;
      if (obtenu < max) auMaximum = false;
    });

    ajouterDrapeau(choisie.drapeau, contexte);
    ajouterVerif(choisie.aVerifier);
    ajouterVerif(critere.aVerifierToujours);
    if (!auMaximum || choisie.drapeau) ajouterVerif(critere.aVerifier);
    return choisie;
  }

  (config.questions || []).forEach(function (question) {
    const rep = reponses[question.id] || {};

    if (question.type === 'familles') {
      const cochees = Array.isArray(rep.familles) ? rep.familles : [];
      const testee = (reponses.q2 || {}).famille;
      (question.familles || []).forEach(function (famille) {
        const points = famille.points || {};
        Object.keys(points).forEach(function (k) {
          if (!acc[k]) return;
          const v = resoudre(points[k]);
          if (v === null) return;
          acc[k].max += v;
          if (cochees.indexOf(famille.id) !== -1) acc[k].obtenus += v;
        });
        if (cochees.indexOf(famille.id) !== -1 && famille.id !== testee) ajouterVerif(famille.aVerifier);
      });
      return;
    }

    if (question.type === 'critere') {
      appliquerCritere(question.critere, rep.option, null);
      return;
    }

    if (question.type === 'criteres') {
      const neutralisation = question.neutralisation;
      if (neutralisation && rep[neutralisation.quand] === true) {
        const cible = acc[neutralisation.sousScore];
        if (cible) { cible.obtenus += neutralisation.obtenus; cible.max += neutralisation.max; }
        return;
      }
      (question.criteres || []).forEach(function (critere) {
        appliquerCritere(critere, rep[critere.id], critere.titre);
      });
      return;
    }

    if (question.type === 'variantes') {
      let variante = null;
      (question.variantes || []).forEach(function (v) { if (v.id === rep.variante) variante = v; });
      appliquerCritere(variante, rep.option, variante ? variante.libelle : null);
    }
  });

  // Épreuve pratique (facultative) : « non observé » et non renseigné sortent du calcul.
  const reglagePratique = config.pratique || {};
  const notes = reglagePratique.notes || {};
  let pratiqueObtenus = 0;
  let pratiqueMax = 0;
  (reglagePratique.gestes || []).forEach(function (geste) {
    const note = gestesSaisis[geste.id];
    const valeur = notes[note];
    if (typeof valeur !== 'number') return;
    const coef = (geste.coefficients || {})[poste] || 0;
    if (!coef) return;
    pratiqueObtenus += coef * valeur;
    pratiqueMax += coef * (notes.reussi || 0);
    if (note !== 'reussi') ajouterVerif('Reprendre « ' + geste.libelle + ' » le premier jour.');
  });

  const sousScores = {};
  config.sousScores.forEach(function (s) {
    const a = acc[s.id];
    const valeur = a.max > 0 ? Math.round((a.obtenus / a.max) * 100) : config.neutre;
    sousScores[s.id] = Math.max(0, Math.min(100, valeur));
  });

  if (pratiqueMax > 0 && typeof sousScores.competences === 'number') {
    const notePratique = Math.round((pratiqueObtenus / pratiqueMax) * 100);
    const melange = sousScores.competences * (reglagePratique.partEntretien || 0) +
                    notePratique * (reglagePratique.partPratique || 0);
    sousScores.competences = Math.max(0, Math.min(100, Math.round(melange)));
  }

  const pond = ponderations[poste];
  let total = 0;
  config.sousScores.forEach(function (s) { total += sousScores[s.id] * (pond[s.id] || 0); });
  total = Math.max(0, Math.min(100, Math.round(total / 100)));

  const seuils = config.seuils || {};
  let verdict = 'non_recommande';
  if (total >= seuils.essai) verdict = 'essai';
  else if (total >= seuils.approfondir) verdict = 'approfondir';

  let bloquants = 0;
  let legers = 0;
  drapeaux.forEach(function (d) {
    if (d.niveau === 'bloquant') bloquants++;
    else if (d.niveau === 'leger') legers++;
  });

  const plafonnement = config.plafonnement || {};
  if (bloquants >= (plafonnement.bloquantsNonRecommande || 2)) verdict = 'non_recommande';
  else if ((bloquants >= 1 || legers >= (plafonnement.legersApprofondir || 3)) && verdict === 'essai') verdict = 'approfondir';

  drapeaux.sort(function (a, b) {
    if (a.niveau === b.niveau) return 0;
    return a.niveau === 'bloquant' ? -1 : 1;
  });

  (config.verifsSystematiques || []).forEach(ajouterVerif);

  return { total: total, sousScores: sousScores, drapeaux: drapeaux, verdict: verdict, pointsAVerifier: pointsAVerifier };
}

function esc(valeur) {

    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* Stockage local : toujours sous try/catch, l'app reste utilisable sans lui. */
function lireStockage(cle, defaut) {
  try {
    const brut = localStorage.getItem(cle);
    return brut ? JSON.parse(brut) : defaut;
  } catch (e) {
    return defaut;
  }
}
function ecrireStockage(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); return true; }
  catch (e) { return false; }
}
function stockageDisponible() {
  try { localStorage.setItem('rem.test', '1'); localStorage.removeItem('rem.test'); return true; }
  catch (e) { return false; }
}

function aujourdhui() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function etatInitial() {
  return {
    ecran: 'accueil',
    identite: { prenom: '', date: aujourdhui(), poste: 'menage', note: '' },
    tirage: { q2Famille: null, q2Tache: null },
    reponses: {
      q1: { familles: [] },
      q2: { famille: null, tache: null, option: null },
      q3: {}, q4: {}, q5: {}, q6: {}, q7: {}, q8: {},
      q9: { premiereExperience: false },
      q10: {}
    },
    pratique: {},
    pratiqueFaite: false,
    index: 0,
    resultat: null,
    enregistre: false
  };
}

let etat = etatInitial();

function hasard(liste) { return liste[Math.floor(Math.random() * liste.length)]; }

function tirerVariantes(seulement) {
  CONFIG.questions.forEach(function (q) {
    if (q.type !== 'variantes') return;
    if (seulement && q.id !== seulement) return;
    const autres = q.variantes.filter(function (v) { return v.id !== (etat.reponses[q.id] || {}).variante; });
    const variante = hasard(autres.length ? autres : q.variantes);
    etat.reponses[q.id] = { variante: variante.id, option: null, note: (etat.reponses[q.id] || {}).note };
  });
}

function tirerTacheQ2() {
  const cochees = etat.reponses.q1.familles || [];
  const q1 = CONFIG.questions.filter(function (q) { return q.id === 'q1'; })[0];
  const familles = q1.familles.filter(function (f) { return cochees.indexOf(f.id) !== -1; });
  if (!familles.length) {
    etat.tirage.q2Famille = null;
    etat.tirage.q2Tache = null;
    etat.reponses.q2 = { famille: null, tache: null, option: 'non_posee', note: etat.reponses.q2.note };
    return;
  }
  if (etat.tirage.q2Famille && cochees.indexOf(etat.tirage.q2Famille) !== -1) return;
  const prioritaires = familles.filter(function (f) {
    return (f.prioritaireQ2 || []).indexOf(etat.identite.poste) !== -1;
  });
  const famille = hasard(prioritaires.length ? prioritaires : familles);
  const tache = hasard(famille.demonstrations);
  etat.tirage.q2Famille = famille.id;
  etat.tirage.q2Tache = tache;
  etat.reponses.q2 = { famille: famille.id, tache: tache, option: null, note: etat.reponses.q2.note };
}

/* ---------- Brouillon : reprise d'un entretien interrompu ---------- */

let minuteurSauvegarde = null;

function entretienCommence() {
  if (etat.ecran === 'entretien' || etat.ecran === 'pratique' || etat.ecran === 'resultat') return true;
  return CONFIG.questions.some(function (q) { return etatQuestion(q) !== 'vide'; });
}

function sauverBrouillon() {
  if (!entretienCommence() || etat.ecran === 'resultat') return;
  ecrireStockage(CLES.brouillon, {
    enregistreLe: new Date().toISOString(),
    identite: etat.identite, tirage: etat.tirage, reponses: etat.reponses,
    pratique: etat.pratique, pratiqueFaite: etat.pratiqueFaite, index: etat.index
  });
}
function planifierSauvegarde() {
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(sauverBrouillon, 350);
}
function effacerBrouillon() { ecrireStockage(CLES.brouillon, null); }

/* ---------- État de chaque question ---------- */

function etatQuestion(question) {
  const rep = etat.reponses[question.id] || {};
  if (question.type === 'familles') return (rep.familles || []).length ? 'complet' : 'vide';
  if (question.type === 'critere' || question.type === 'variantes') return rep.option ? 'complet' : 'vide';
  if (question.type === 'criteres') {
    if (question.neutralisation && rep[question.neutralisation.quand] === true) return 'complet';
    const faits = question.criteres.filter(function (c) { return rep[c.id]; }).length;
    if (!faits) return 'vide';
    return faits === question.criteres.length ? 'complet' : 'partiel';
  }
  return 'vide';
}

function varianteDe(question, rep) {
  return question.variantes.filter(function (v) { return v.id === (rep || {}).variante; })[0] || null;
}
function libelleOption(options, id) {
  const o = (options || []).filter(function (x) { return x.id === id; })[0];
  return o ? o.libelle : null;
}

function anneauScore(total) {
  const rayon = 42;
  const tour = 2 * Math.PI * rayon;
  const valeur = Math.max(0, Math.min(100, total));
  return '<svg class="anneau" width="124" height="124" viewBox="0 0 100 100" role="img" aria-label="Score ' + valeur + ' sur 100">' +
    '<circle cx="50" cy="50" r="' + rayon + '" fill="none" stroke="rgba(125,125,125,.38)" stroke-width="11"/>' +
    '<circle cx="50" cy="50" r="' + rayon + '" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"' +
      ' stroke-dasharray="' + (tour * valeur / 100).toFixed(1) + ' ' + tour.toFixed(1) + '" transform="rotate(-90 50 50)"/>' +
    '<text class="valeur" x="50" y="48" text-anchor="middle" dominant-baseline="middle">' + valeur + '</text>' +
    '<text class="sur" x="50" y="68" text-anchor="middle">sur 100</text></svg>';
}

function brancher(selecteur, evenement, action) {

    if (champ) champ.addEventListener('change', function () { etat.identite[cle] = champ.value; planifierSauvegarde(); });

  surClic('reprendre', function () {
    etat = Object.assign(etatInitial(), {
      identite: Object.assign(etatInitial().identite, brouillon.identite),

  const question = CONFIG.questions[etat.index];

  const rep = etat.reponses[question.id] || {};
  let html = '';

  html += '<div class="pastilles sansImpression">';
  CONFIG.questions.forEach(function (q, position) {

    '<span class="titre">' + esc(question.titre) + '</span>' +
    '<span class="sujet">' + esc(question.sujet) + '</span></span></div>';

  if (question.type === 'familles') {
    html += '<p class="enonce">' + esc(question.texte) + '</p>';
    if (question.consigne) html += '<p class="consigne">' + esc(question.consigne) + '</p>';
    html += '<div class="options">';
    question.familles.forEach(function (f) {
      const horsPoste = f.points.competences[etat.identite.poste] === null;
      html += '<label class="option"><input type="checkbox" data-famille="' + esc(f.id) + '"' +
        ((rep.familles || []).indexOf(f.id) !== -1 ? ' checked' : '') + '>' +
        '<span class="marque" aria-hidden="true"></span><span class="texte">' + esc(f.libelle) +
        '<span class="sous">' + esc(f.detail) + '</span>' +
        (horsPoste ? '<span class="note">Hors barème pour ce poste : cocher ou non ne change pas le score.</span>' : '') +
        '</span></label>';
    });
    html += '</div>';
  } else if (question.type === 'critere') {
    let texte = question.texte;
    if (question.id === 'q2') texte = texte.split('[TACHE]').join(etat.tirage.q2Tache || '…');
    if (question.id === 'q7') texte = texte.split('[PRODUIT]').join(reglages.produit);
    html += '<p class="enonce">' + esc(texte) + '</p>';
    if (question.id === 'q2' && !etat.tirage.q2Tache) {
      html += '<p class="encadre">Elle n’a coché aucune tâche : cette question est retirée du calcul.</p>';
    }
    if (question.consigne) {
      html += '<p class="consigne">' +
        esc(question.consigne.split('[USAGE]').join(reglages.usage).split('[PRODUIT]').join(reglages.produit)) + '</p>';
    }
    html += '<div class="options">';
    question.critere.options.forEach(function (o) {
      if (o.id === 'non_posee' && etat.tirage.q2Tache) return;
      html += optionHtml(question.id, o, rep.option, 'radio');
    });
    html += '</div>';
  } else if (question.type === 'criteres') {
    html += '<p class="enonce">' + esc(question.texte) + '</p>';
    if (question.consigne) html += '<p class="consigne">' + esc(question.consigne) + '</p>';
    if (question.neutralisation) {
      html += '<label class="option"><input type="checkbox" data-neutralisation="' + esc(question.id) + '"' +
        (rep[question.neutralisation.quand] === true ? ' checked' : '') + '>' +
        '<span class="marque" aria-hidden="true"></span><span class="texte">Première expérience : elle n’a jamais travaillé' +
        '<span class="sous">Aucun drapeau n’est levé et le sous-score Stabilité est neutralisé.</span></span></label>';
    }
    if (!(question.neutralisation && rep[question.neutralisation.quand] === true)) {
      question.criteres.forEach(function (critere) {
        html += '<div class="carte"><h3>' + esc(critere.titre) + '</h3>';
        if (critere.texte) html += '<p class="enonce" style="font-size:1.08rem">' + esc(critere.texte) + '</p>';
        html += '<div class="options">';
        critere.options.forEach(function (o) {
          html += optionHtml(question.id + '.' + critere.id, o, rep[critere.id], 'radio');
        });
        html += '</div></div>';
      });
    }
  } else if (question.type === 'variantes') {
    const variante = varianteDe(question, rep) || question.variantes[0];
    html += '<p class="fil"><span>Scénario tiré au hasard</span><b>' + esc(variante.libelle) + '</b></p>';
    html += '<p class="enonce">' + esc(variante.texte) + '</p>';
    if (question.consigne) html += '<p class="consigne">' + esc(question.consigne) + '</p>';
    html += '<div class="options">';
    variante.options.forEach(function (o) { html += optionHtml(question.id, o, rep.option, 'radio'); });
    html += '</div>';
    html += '<button class="bouton secondaire petit sansImpression" data-retirage="' + esc(question.id) + '">Tirer un autre scénario</button>';
  }

  html += champNote(rep.note);

  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><div class="rangee">' +
    '<button class="bouton secondaire" id="precedent">Précédent</button>' +
    '<button class="bouton secondaire" data-aller="sommaire">Sommaire</button>' +
    '<button class="bouton" id="suivant">' + (etat.index === total - 1 ? 'Terminer' : 'Suivant') + '</button>' +
    '</div></div>';

  brancher('input[type=radio]', 'change', function (e) {
    const morceaux = e.currentTarget.getAttribute('name').split('.');
    if (morceaux.length === 2) etat.reponses[morceaux[0]][morceaux[1]] = e.currentTarget.value;
    else etat.reponses[morceaux[0]].option = e.currentTarget.value;
    majPastilles();
    planifierSauvegarde();
  });
  brancher('[data-famille]', 'change', function (e) {
    const cible = e.currentTarget.getAttribute('data-famille');
    const liste = etat.reponses.q1.familles || [];
    const position = liste.indexOf(cible);
    if (e.currentTarget.checked && position === -1) liste.push(cible);
    if (!e.currentTarget.checked && position !== -1) liste.splice(position, 1);
    etat.reponses.q1.familles = liste;
    majPastilles();
    planifierSauvegarde();
  });
  brancher('[data-neutralisation]', 'change', function (e) {
    const q = e.currentTarget.getAttribute('data-neutralisation');
    const def = CONFIG.questions.filter(function (x) { return x.id === q; })[0];
    etat.reponses[q][def.neutralisation.quand] = e.currentTarget.checked;
    rendre();
  });
  brancher('[data-retirage]', 'click', function (e) {
    tirerVariantes(e.currentTarget.getAttribute('data-retirage'));
    rendre();
  });
  brancher('[data-question]', 'click', function (e) {
    etat.index = Number(e.currentTarget.getAttribute('data-question'));
    rendre();
  });
  brancher('[data-aller]', 'click', function (e) { aller(e.currentTarget.getAttribute('data-aller')); });

  const noteQ = document.getElementById('noteQ');
  if (noteQ) noteQ.addEventListener('input', function () {
    etat.reponses[question.id].note = noteQ.value;
    planifierSauvegarde();
  });

  surClic('precedent', function () {
    if (etat.index === 0) { aller('accueil'); return; }
    etat.index--;
    rendre();
  });
  surClic('suivant', function () {
    if (question.id === 'q1') tirerTacheQ2();
    if (etat.index === total - 1) { aller('pratique'); return; }
    etat.index++;
    rendre();
  });
}

function majPastilles() {
  $ecran.querySelectorAll('[data-question]').forEach(function (n) {
    const q = CONFIG.questions[Number(n.getAttribute('data-question'))];
    n.className = 'pastille ' + etatQuestion(q) + (CONFIG.questions[etat.index] === q ? ' courant' : '');
  });
}

/* ---------- Épreuve pratique ---------- */

function rendrePratique() {
  const poste = etat.identite.poste;
  let html = '<h1>Épreuve pratique</h1>';
  html += '<p>Facultative. Laisse <b>« non observé »</b> pour un geste que tu n’as pas vu : il est retiré du calcul.</p>';
  html += '<p class="consigne">Les gestes comptent pour le sous-score Compétences. Les gestes de cuisine pèsent plus lourd quand le poste est « aide cuisinière ».</p>';

  CONFIG.pratique.gestes.forEach(function (geste) {
    const valeur = etat.pratique[geste.id] || 'non_observe';
    html += '<div class="carte"><h3 style="display:flex;align-items:center;gap:10px">' + medaillon(geste.icone, true) +
      '<span>' + esc(geste.libelle) + '<small style="display:block;font-weight:400">poids ' +
      esc(geste.coefficients[poste]) + '</small></span></h3><div class="options grille2">';
    ['reussi', 'partiel', 'non_fait', 'non_observe'].forEach(function (note) {
      html += optionHtml('pratique.' + geste.id, { id: note, libelle: CONFIG.pratique.libellesNotes[note] }, valeur, 'radio');
    });
    html += '</div></div>';
  });

  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><div class="rangee">' +
    '<button class="bouton secondaire" id="retour">Précédent</button>' +
    '<button class="bouton secondaire" id="passer">Passer</button>' +
    '<button class="bouton" id="terminer">Voir le résultat</button></div></div>';

  brancher('input[type=radio]', 'change', function (e) {
    etat.pratique[e.currentTarget.getAttribute('name').split('.')[1]] = e.currentTarget.value;
    etat.pratiqueFaite = true;
    planifierSauvegarde();
  });
  surClic('retour', function () { etat.index = CONFIG.questions.length - 1; aller('entretien'); });
  surClic('passer', function () { etat.pratique = {}; etat.pratiqueFaite = false; calculerEtAfficher(); });
  surClic('terminer', calculerEtAfficher);
}

/* ---------- Résultat ---------- */

/* Seuls le poste, les options cochées et l'épreuve pratique sont transmis au barème.
   Les renseignements de l'écran d'accueil (prénom, note libre) ne sont jamais passés,
   et les notes libres écrites question par question sont retirées avant l'appel :
   elles peuvent contenir des éléments de vie privée, qui n'ont rien à faire dans le calcul. */
function construireAnswers() {
  const reponses = {};
  Object.keys(etat.reponses).forEach(function (q) {
    const source = etat.reponses[q] || {};
    const copie = {};
    Object.keys(source).forEach(function (cle) {
      if (cle === 'note') return;
      copie[cle] = JSON.parse(JSON.stringify(source[cle]));
    });
    reponses[q] = copie;
  });
  return {
    poste: etat.identite.poste,
    reponses: reponses,
    pratique: etat.pratiqueFaite ? JSON.parse(JSON.stringify(etat.pratique)) : {}
  };
}

function questionsSansReponse() {
  return CONFIG.questions.filter(function (q) { return etatQuestion(q) !== 'complet'; })
    .map(function (q) { return q.sujet.charAt(0).toLowerCase() + q.sujet.slice(1); });
}

function calculerEtAfficher() {
  etat.resultat = computeScore(construireAnswers(), CONFIG);
  etat.enregistre = false;
  effacerBrouillon();
  aller('resultat');
}

function detailReponses() {
  let html = '<dl>';
  CONFIG.questions.forEach(function (q) {
    const rep = etat.reponses[q.id] || {};
    html += '<dt data-theme="' + esc(q.couleur) + '">' + pic(q.icone) + esc(q.titre) + '</dt>' +
      '<dd><span class="sujet">' + esc(q.sujet) + '</span>';
    if (q.type === 'familles') {
      const noms = q.familles.filter(function (f) { return (rep.familles || []).indexOf(f.id) !== -1; })
        .map(function (f) { return f.libelle; });
      html += noms.length ? 'Elle dit savoir faire : ' + esc(noms.join(', ')) + '.' : 'Elle n\u2019a rien coché.';
    } else if (q.type === 'criteres') {
      if (q.neutralisation && rep[q.neutralisation.quand] === true) html += 'Première expérience : elle n\u2019a jamais travaillé.';
      else html += q.criteres.map(function (c) {
        return esc(c.titre) + ' : ' + esc(libelleOption(c.options, rep[c.id]) || 'pas de réponse cochée');
      }).join('<br>');
    } else {
      const variante = q.type === 'variantes' ? varianteDe(q, rep) : null;
      const options = variante ? variante.options : q.critere.options;
      if (variante) html += 'Scénario « ' + esc(variante.libelle) + ' ». ';
      if (q.id === 'q2' && etat.tirage.q2Tache) html += 'Tâche demandée : ' + esc(etat.tirage.q2Tache) + '. ';
      html += esc(libelleOption(options, rep.option) || 'Pas de réponse cochée') + '.';
    }
    if (rep.note) html += '<br><small>Ce qu\u2019elle a dit : ' + esc(rep.note) + '</small>';
    html += '</dd>';
  });
  return html + '</dl>';
}

function rendreResultat() {
  const r = etat.resultat;
  const id = etat.identite;
  const verdict = CONFIG.verdicts[r.verdict];
  const manquantes = questionsSansReponse();
  const iconeVerdict = r.verdict === 'essai' ? 'coche' : (r.verdict === 'approfondir' ? 'leger' : 'bloquant');

  let html = '<h1>Ce que dit l\u2019entretien</h1>';
  html += '<div class="hero ' + esc(r.verdict) + '"><div class="dedans">' + anneauScore(r.total) +
    '<div class="texte"><p class="qui">' + esc(id.prenom || 'Candidate') + ' — ' + esc(id.date) + ' — ' +
    esc(libellePoste(id.poste)) + '</p>' +
    '<p class="verdict-titre">' + pic(iconeVerdict) + esc(verdict.libelle) + '</p>' +
    '<p class="verdict-detail">' + esc(verdict.detail) + '</p></div></div></div>';

  html += '<div class="encadre"><b>Cet outil est une aide à la décision. Ce n\u2019est pas un détecteur de mensonge.</b> ' +
    'Il signale des incohérences et des points à vérifier, pas des mensonges.</div>';

  if (manquantes.length) {
    html += '<p class="encadre info"><b>Ces questions n\u2019ont pas reçu de réponse complète et sont retirées du calcul :</b> ' +
      esc(manquantes.join(' ; ')) + '.</p>';
  }

  html += '<h2>' + pic('balance') + 'Le détail par domaine</h2><div class="carte">';
  CONFIG.sousScores.forEach(function (sous) {
    const v = r.sousScores[sous.id];
    html += '<div class="sous-score" data-theme="' + esc(sous.couleur) + '">' + medaillon(sous.icone, true) +
      '<div class="corps"><div class="ligne"><span>' + esc(sous.libelle) + '</span><em>' + v + ' sur 100</em></div>' +
      '<span class="resume">' + esc(sous.resume) + '</span>' +
      '<div class="jauge"><i style="width:' + v + '%"></i></div>' +
      '<span class="resume">Ce domaine pèse ' + CONFIG.ponderations[id.poste][sous.id] +
      ' points sur les 100 du total, pour ce poste.</span></div></div>';
  });
  html += '</div>';

  html += '<h2>' + pic('leger') + 'Ce qui doit t\u2019alerter</h2>';
  if (!r.drapeaux.length) {
    html += '<p>Rien ne s\u2019est allumé pendant cet entretien : aucune de ses réponses ne demande de précaution particulière.</p>';
  } else {
    r.drapeaux.forEach(function (d) {
      html += '<div class="drapeau ' + esc(d.niveau) + '">' + pic(d.niveau) +
        '<div><span class="etiquette">' + (d.niveau === 'bloquant' ? 'À ne pas laisser passer' : 'À garder en tête') + '</span>' +
        '<span class="message">' + esc(d.message) + '</span></div></div>';
    });
  }

  html += '<h2>' + pic('coche') + 'Ce qu\u2019il reste à faire</h2>';
  if (!r.pointsAVerifier.length) html += '<p>Rien de particulier à vérifier.</p>';
  else {
    html += '<div class="carte"><ul class="verifs">';
    r.pointsAVerifier.forEach(function (point) { html += '<li>' + esc(point) + '</li>'; });
    html += '</ul></div>';
  }

  if (id.note) html += '<h2>' + pic('parole') + 'Ta note libre</h2><p>' + esc(id.note) + '</p>';

  html += '<h2>' + pic('liste') + 'Ce qu\u2019elle a répondu</h2><details class="detail-reponses carte">' +
    '<summary>Voir les dix réponses, une par une</summary>' + detailReponses() + '</details>';

  html += '<div class="carte sansImpression"><h3>Garder une trace de cet entretien</h3><div class="rangee">' +
    '<button class="bouton secondaire avecPic" id="imprimer">' + pic('imprimer') + 'Imprimer</button>' +
    '<button class="bouton secondaire avecPic" id="json">' + pic('telecharger') + 'JSON</button>' +
    '<button class="bouton secondaire avecPic" id="csv">' + pic('telecharger') + 'CSV</button></div>' +
    '<button class="bouton secondaire avecPic" id="enregistrer">' + pic('archive') +
      (etat.enregistre ? 'Enregistré sur ce téléphone' : 'Enregistrer sur ce téléphone') + '</button>' +
    '<small>Les exports restent sur ce téléphone. Ne les envoie pas à des tiers sans l\u2019accord de la candidate.</small></div>';

  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><div class="rangee">' +
    '<button class="bouton secondaire" data-aller="sommaire">Revoir les réponses</button>' +
    '<button class="bouton" id="nouveau">Nouvel entretien</button></div></div>';

  surClic('imprimer', function () { print(); });
  surClic('json', exporterJson);
  surClic('csv', exporterCsv);
  surClic('enregistrer', enregistrerHistorique);
  brancher('[data-aller]', 'click', function (e) { aller(e.currentTarget.getAttribute('data-aller')); });
  surClic('nouveau', function () {
    if (!confirm('Commencer un nouvel entretien ? Les réponses en cours seront effacées.')) return;
    effacerBrouillon();
    etat = etatInitial();
    aller('accueil');
  });
}

/* ---------- Exports ---------- */

function nomFichier(extension) {
  const prenom = (etat.identite.prenom || 'candidate')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'candidate';
  return 'entretien-' + prenom + '-' + (etat.identite.date || aujourdhui()) + '.' + extension;
}

function telecharger(nom, contenu, type) {
  try {
    const blob = new Blob([contenu], { type: type + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const lien = document.createElement('a');
    lien.href = url;
    lien.download = nom;
    document.body.appendChild(lien);
    lien.click();
    document.body.removeChild(lien);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  } catch (e) {
    alert('Le téléchargement a échoué sur ce téléphone. Utilise « Imprimer » pour garder une trace.');
  }
}

function enregistrementComplet() {
  return {
    version: CONFIG.version,
    identite: etat.identite,
    poste: etat.identite.poste,
    tirage: etat.tirage,
    produitFictif: reglages.produit,
    reponses: etat.reponses,
    pratique: etat.pratiqueFaite ? etat.pratique : null,
    resultat: etat.resultat
  };
}

function exporterJson() {
  telecharger(nomFichier('json'), JSON.stringify(enregistrementComplet(), null, 2), 'application/json');
}

function celluleCsv(valeur) {
  const texte = String(valeur === null || valeur === undefined ? '' : valeur);
  return /[;"\n\r]/.test(texte) ? '"' + texte.replace(/"/g, '""') + '"' : texte;
}

function exporterCsv() {
  const r = etat.resultat;
  const lignes = [['champ', 'valeur']];
  lignes.push(['prenom', etat.identite.prenom]);
  lignes.push(['date', etat.identite.date]);
  lignes.push(['poste', etat.identite.poste]);
  lignes.push(['total', r.total]);
  lignes.push(['verdict', r.verdict]);
  CONFIG.sousScores.forEach(function (s) { lignes.push(['sous_score_' + s.id, r.sousScores[s.id]]); });
  lignes.push(['drapeaux', r.drapeaux.map(function (d) { return d.niveau + ':' + d.id; }).join(' | ')]);
  lignes.push(['points_a_verifier', r.pointsAVerifier.join(' | ')]);
  CONFIG.questions.forEach(function (q) {
    const rep = etat.reponses[q.id] || {};
    let valeur = '';
    if (q.type === 'familles') valeur = (rep.familles || []).join(' | ');
    else if (q.type === 'criteres') {
      valeur = q.criteres.map(function (c) { return c.id + '=' + (rep[c.id] || ''); }).join(' | ');
      if (q.neutralisation && rep[q.neutralisation.quand] === true) valeur = q.neutralisation.quand;
    } else valeur = (rep.variante ? rep.variante + ':' : '') + (rep.option || '');
    lignes.push([q.id, valeur]);
    if (rep.note) lignes.push([q.id + '_note', rep.note]);
  });
  if (etat.pratiqueFaite) {
    CONFIG.pratique.gestes.forEach(function (g) { lignes.push(['pratique_' + g.id, etat.pratique[g.id] || 'non_observe']); });
  }
  lignes.push(['note_libre', etat.identite.note]);
  telecharger(nomFichier('csv'), '﻿' + lignes.map(function (l) { return l.map(celluleCsv).join(';'); }).join('\r\n'), 'text/csv');
}

/* ---------- Historique ---------- */

function enregistrerHistorique() {
  const liste = lireStockage(CLES.historique, []);
  liste.unshift(Object.assign({ enregistreLe: new Date().toISOString() }, enregistrementComplet()));
  if (ecrireStockage(CLES.historique, liste.slice(0, 50))) {
    etat.enregistre = true;
    rendre();
  } else {
    alert('Impossible d’enregistrer sur ce téléphone. Utilise l’export ou l’impression.');
  }
}

function rendreHistorique() {
  const liste = lireStockage(CLES.historique, []);
  let html = '<h1>Historique</h1>';
  if (!stockageDisponible()) {
    html += '<p class="encadre">Le stockage local n’est pas disponible sur ce navigateur. L’app reste utilisable, mais rien n’est gardé.</p>';
  }
  html += '<p>Les entretiens enregistrés restent sur ce téléphone. Personne d’autre n’y a accès.</p>';
  if (!liste.length) html += '<p>Aucun entretien enregistré.</p>';
  else {
    html += '<ul class="liste">';
    liste.forEach(function (item, position) {
      const res = item.resultat || {};
      html += '<li><div class="fil"><b>' + esc((item.identite || {}).prenom || 'Candidate') + '</b>' +
        '<span class="chip ' + esc(res.verdict || 'vide') + '">' + esc(res.total != null ? res.total + '/100' : '—') + '</span></div>' +
        '<p class="petit">' + esc((item.identite || {}).date || '') + ' — ' + esc(libellePoste(item.poste)) +
        ' — ' + ((res.drapeaux || []).length) + ' drapeau(x)</p>' +
        '<button class="bouton secondaire petit" data-ouvrir="' + position + '">Ouvrir</button></li>';
    });
    html += '</ul><button class="bouton danger" id="effacer">Effacer l’historique</button>';
  }

  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><button class="bouton secondaire" data-aller="accueil">Retour</button></div>';

  brancher('[data-ouvrir]', 'click', function (e) {
    const item = liste[Number(e.currentTarget.getAttribute('data-ouvrir'))];
    if (!item) return;
    etat = etatInitial();
    etat.identite = Object.assign(etat.identite, item.identite || {});
    etat.tirage = item.tirage || etat.tirage;
    etat.reponses = Object.assign(etat.reponses, item.reponses || {});
    etat.pratique = item.pratique || {};
    etat.pratiqueFaite = !!item.pratique;
    etat.resultat = item.resultat || computeScore(construireAnswers(), CONFIG);
    etat.enregistre = true;
    aller('resultat');
  });
  brancher('[data-aller]', 'click', function (e) { aller(e.currentTarget.getAttribute('data-aller')); });
  surClic('effacer', function () {
    if (!confirm('Effacer tout l’historique de ce téléphone ? C’est définitif.')) return;
    ecrireStockage(CLES.historique, []);
    rendre();
  });
}

/* ---------- Réglages ---------- */

function rendreReglages() {
  let html = '<h1>Réglages</h1>';

  html += '<div class="carte"><h3>Affichage</h3>' +
    '<p class="petit">Le mode plein soleil agrandit le texte et renforce les contrastes, pour lire dehors.</p>' +
    '<button class="bouton secondaire" id="bascule">' +
      (affichage.contraste === 'fort' ? 'Revenir à l’affichage normal' : 'Activer le mode plein soleil') + '</button></div>';

  html += '<div class="carte"><h3>Produit fictif de la question 7</h3>' +
    '<p class="petit">Ce produit ne doit pas exister sur le marché de Niamey. Vérifie-le auprès de plusieurs vendeurs, et change-le de temps en temps : le dépôt est public.</p>' +
    '<label class="champ" for="produit">Nom du produit</label><input type="text" id="produit" value="' + esc(reglages.produit) + '">' +
    '<label class="champ" for="usage">Usage annoncé (pour la relance)</label><input type="text" id="usage" value="' + esc(reglages.usage) + '">' +
    '<button class="bouton" id="sauver">Enregistrer</button>' +
    '<button class="bouton secondaire petit" id="defaut">Revenir au nom par défaut</button></div>';

  html += '<div class="carte"><h3>Seuils du verdict</h3><table><tr><th>Verdict</th><th>Score</th></tr>' +
    '<tr><td>' + esc(CONFIG.verdicts.essai.libelle) + '</td><td>' + CONFIG.seuils.essai + ' et plus</td></tr>' +
    '<tr><td>' + esc(CONFIG.verdicts.approfondir.libelle) + '</td><td>' + CONFIG.seuils.approfondir + ' à ' + (CONFIG.seuils.essai - 1) + '</td></tr>' +
    '<tr><td>' + esc(CONFIG.verdicts.non_recommande.libelle) + '</td><td>moins de ' + CONFIG.seuils.approfondir + '</td></tr></table>' +
    '<p class="petit"><b>Plafonnement :</b> 1 drapeau bloquant → au mieux « à approfondir ». ' +
    CONFIG.plafonnement.bloquantsNonRecommande + ' bloquants ou plus → « non recommandé ». ' +
    CONFIG.plafonnement.legersApprofondir + ' drapeaux légers ou plus → au mieux « à approfondir ».</p>' +
    '<p class="petit">Valeurs de départ, à recalibrer après une quinzaine d’entretiens réels.</p></div>';

  html += '<div class="carte"><h3>Pondérations par poste</h3><table><tr><th>Poste</th>' +
    CONFIG.sousScores.map(function (s) { return '<th>' + esc(s.libelle) + '</th>'; }).join('') + '</tr>';
  CONFIG.postes.forEach(function (p) {
    html += '<tr><td>' + esc(p.libelle) + '</td>' +
      CONFIG.sousScores.map(function (s) { return '<td>' + CONFIG.ponderations[p.id][s.id] + '</td>'; }).join('') + '</tr>';
  });
  html += '</table></div>';

  html += '<div class="carte plate"><h3>Vérification du barème</h3>' +
    '<p class="petit">Ouvre <code>index.html?selftest=1</code> pour lancer les tests du barème dans ce navigateur.</p>' +
    '<p class="petit">Version du barème : ' + esc(CONFIG.version) + '</p></div>';

  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><button class="bouton secondaire" data-aller="accueil">Retour</button></div>';

  surClic('bascule', function () {
    affichage.contraste = affichage.contraste === 'fort' ? 'normal' : 'fort';
    ecrireStockage(CLES.affichage, affichage);
    rendre();
  });
  surClic('sauver', function () {
    reglages.produit = document.getElementById('produit').value.trim() || reglagesParDefaut.produit;
    reglages.usage = document.getElementById('usage').value.trim();
    if (!ecrireStockage(CLES.reglages, reglages)) {
      alert('Le réglage est appliqué pour cet entretien, mais il n’a pas pu être gardé sur ce téléphone.');
    }
    aller('accueil');
  });
  surClic('defaut', function () {
    reglages = Object.assign({}, reglagesParDefaut);
    ecrireStockage(CLES.reglages, reglages);
    rendre();
  });
  brancher('[data-aller]', 'click', function (e) { aller(e.currentTarget.getAttribute('data-aller')); });
}

/* ---------- Mode ?selftest=1 ---------- */

function executerTests() {
  const SOUS_SCORES = CONFIG.sousScores.map(function (s) { return s.id; });
  const FAUSSES_DONNEES = [
    { situationFamiliale: 'mariée, mari au village', nationalite: 'béninoise', langueEntretien: 'zarma', religion: 'A', ethnie: 'X' },
    { situationFamiliale: 'célibataire', nationalite: 'togolaise', langueEntretien: 'haoussa', religion: 'B', ethnie: 'Y' }
  ];
  const resume = function (r) {
    return JSON.stringify({
      total: r.total, sousScores: r.sousScores, verdict: r.verdict,
      drapeaux: r.drapeaux.map(function (d) { return d.niveau + ':' + d.id; }).sort()
    });
  };
  return TEST_CASES.map(function (tc) {
    const erreurs = [];
    let r = null;
    try { r = computeScore(JSON.parse(JSON.stringify(tc.answers)), CONFIG); }
    catch (e) { return { nom: tc.name, erreurs: ['exception : ' + e.message] }; }

    if (!Number.isInteger(r.total) || r.total < 0 || r.total > 100) erreurs.push('total hors [0, 100]');
    SOUS_SCORES.forEach(function (k) {
      const v = r.sousScores[k];
      if (typeof v !== 'number' || v < 0 || v > 100) erreurs.push('sousScores.' + k + ' invalide');
    });
    if (!Array.isArray(r.drapeaux)) erreurs.push('drapeaux doit être un tableau');
    if (!Array.isArray(r.pointsAVerifier)) erreurs.push('pointsAVerifier doit être un tableau');

    const attendu = tc.expect || {};
    const ids = r.drapeaux.map(function (d) { return d.id; });
    if (attendu.verdict && r.verdict !== attendu.verdict) erreurs.push('verdict « ' + r.verdict + ' » au lieu de « ' + attendu.verdict + ' »');
    if (attendu.minTotal != null && r.total < attendu.minTotal) erreurs.push('total ' + r.total + ' < ' + attendu.minTotal);
    if (attendu.maxTotal != null && r.total > attendu.maxTotal) erreurs.push('total ' + r.total + ' > ' + attendu.maxTotal);
    (attendu.drapeauxInclus || []).forEach(function (id) { if (ids.indexOf(id) === -1) erreurs.push('drapeau manquant : ' + id); });
    (attendu.drapeauxExclus || []).forEach(function (id) { if (ids.indexOf(id) !== -1) erreurs.push('drapeau inattendu : ' + id); });

    let bloquants = 0, legers = 0;
    r.drapeaux.forEach(function (d) { if (d.niveau === 'bloquant') bloquants++; else legers++; });
    if (bloquants >= 2 && r.verdict !== 'non_recommande') erreurs.push('plafonnement non appliqué (2 bloquants)');
    if ((bloquants === 1 || legers >= 3) && r.verdict === 'essai') erreurs.push('plafonnement non appliqué');

    const reference = resume(r);
    FAUSSES_DONNEES.forEach(function (fausses) {
      const a = Object.assign(JSON.parse(JSON.stringify(tc.answers)), fausses);
      if (resume(computeScore(a, CONFIG)) !== reference) erreurs.push('le résultat change avec des données personnelles (équité)');
    });

    return { nom: tc.name, erreurs: erreurs, resultat: r };
  });
}

function rendreSelftest() {
  const resultats = executerTests();
  const echecs = resultats.filter(function (x) { return x.erreurs.length; });
  let html = '<h1>Auto-test du barème</h1>';
  html += '<p class="' + (echecs.length ? 'ko' : 'ok') + '">' +
    (echecs.length ? '✗ ' + echecs.length + ' échec(s) sur ' + resultats.length + ' cas'
                   : '✓ Tout est vert — ' + resultats.length + ' cas') + '</p>';
  resultats.forEach(function (x) {
    html += '<div class="carte"><b class="' + (x.erreurs.length ? 'ko' : 'ok') + '">' +
      (x.erreurs.length ? '✗' : '✓') + ' ' + esc(x.nom) + '</b>';
    if (x.resultat) {
      html += '<p class="petit">' + esc(x.resultat.verdict) + ' — ' + x.resultat.total + '/100 — drapeaux : ' +
        esc(x.resultat.drapeaux.map(function (d) { return d.niveau + ':' + d.id; }).join(', ') || 'aucun') + '</p>';
    }
    if (x.erreurs.length) html += '<pre>' + esc(x.erreurs.join('\n')) + '</pre>';
    html += '</div>';
  });
  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><a class="bouton" href="index.html">Retour à l’app</a></div>';
}

/* ---------- Démarrage ---------- */

(function demarrer() {
  appliquerAffichage();
  const soleil = document.getElementById('soleil');
  if (soleil) soleil.addEventListener('click', function () {
    affichage.contraste = affichage.contraste === 'fort' ? 'normal' : 'fort';
    ecrireStockage(CLES.affichage, affichage);
    appliquerAffichage();
  });

  try {
    addEventListener('beforeprint', function () {
      document.querySelectorAll('details').forEach(function (d) { d.open = true; });
    });
  } catch (e) { /* sans effet hors navigateur */ }

  let selftest = false;
  try { selftest = /(?:^|[?&])selftest=1(?:&|$)/.test(location.search); } catch (e) { selftest = false; }
  if (selftest) { rendreSelftest(); appliquerAffichage(); return; }
  rendre();
})();
</script>
