<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1f4f8f">
<meta name="apple-mobile-web-app-title" content="Entretien">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f4f8f'/%3E%3Cpath d='M5.6 11.6 12 6.4l6.4 5.2M7.2 10.6v7.4h9.6v-7.4M10.4 18v-3.6h3.2V18' fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Entretien aide ménagère — Niamey</title>
<style>
:root{
  --fond:#faf6f0; --surface:#ffffff; --surface-douce:#f4efe7;
  --encre:#1c1917; --encre-douce:#57514b;
  --trait:#ddd2c2; --trait-fort:#a89780;
  --primaire:#1f4f8f; --primaire-sombre:#153a6d; --primaire-pale:#e7eefa;
  --sable:#c9832b; --sable-pale:#fbf0dc;
  --vert:#15603a; --vert-pale:#e2f2e8;
  --orange:#9a5410; --orange-pale:#fcefdd;
  --rouge:#96111a; --rouge-pale:#fceaea;
  --t:var(--primaire); --t-pale:var(--primaire-pale);
  --rayon:16px; --rayon-petit:11px;
  --bord:2px;
  --ombre:0 1px 2px rgba(60,40,20,.06), 0 8px 20px rgba(60,40,20,.08);
  --ombre-douce:0 1px 3px rgba(60,40,20,.08);
  --base:17px;
}
[data-theme=indigo]   {--t:#33539e;--t-pale:#e9edf9}
[data-theme=violet]   {--t:#6b4ea8;--t-pale:#efe9fa}
[data-theme=turquoise]{--t:#0e7a72;--t-pale:#e0f4f1}
[data-theme=brique]   {--t:#b34524;--t-pale:#fbe9e3}
[data-theme=ocre]     {--t:#8d6114;--t-pale:#faf0dd}
[data-theme=foret]    {--t:#2a6e46;--t-pale:#e4f2e9}
[data-theme=prune]    {--t:#8d3a63;--t-pale:#f9e7f0}
[data-theme=ardoise]  {--t:#3f6483;--t-pale:#e8f0f6}
[data-theme=orange]   {--t:#a85c18;--t-pale:#fceede}
[data-theme=bleu]     {--t:#1f5aa8;--t-pale:#e6eefa}

html[data-contraste=fort]{
  --fond:#ffffff; --surface:#ffffff; --surface-douce:#ffffff;
  --encre:#000000; --encre-douce:#1c1917;
  --trait:#000000; --trait-fort:#000000;
  --primaire:#00316f; --primaire-pale:#dbe8fa;
  --vert:#04471c; --orange:#6d3a00; --rouge:#7d0d14;
  --bord:3px; --ombre:none; --ombre-douce:none; --base:20px;
}
html[data-contraste=fort] [data-theme]{--t-pale:#ffffff}
html[data-contraste=fort] body{background-image:none}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--fond); color:var(--encre);
  background-image:radial-gradient(circle at 1px 1px, rgba(140,110,70,.10) 1px, transparent 0);
  background-size:20px 20px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--base); line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.enveloppe{max-width:760px;margin:0 auto;padding:14px 16px 122px}
h1{font-size:1.5rem;line-height:1.15;margin:.1em 0 .5em;letter-spacing:-.02em}
h2{font-size:1.18rem;margin:1.5em 0 .5em;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
h3{font-size:1.02rem;margin:0 0 .5em}
p{margin:.55em 0}
small,.petit{font-size:.84rem;color:var(--encre-douce);line-height:1.4}

/* ---- Bandeau ---- */
.bandeau{
  color:#fff;border-bottom:4px solid var(--sable);
  background:linear-gradient(135deg,#1f4f8f 0%,#153a6d 60%,#15325e 100%);
}
.bandeau .dedans{max-width:760px;margin:0 auto;padding:9px 16px;display:flex;gap:10px;align-items:center}
.bandeau .marque{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.3)}
.bandeau .marque svg{width:21px;height:21px}
.bandeau .titre{flex:1 1 auto;min-width:0}
.bandeau .titre b{display:block;font-size:.95rem;line-height:1.2}
.bandeau .titre span{display:block;font-size:.74rem;line-height:1.25;color:#d7e3f3}
.soleil{flex:0 0 auto;background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.5);
  border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:700;white-space:nowrap}
html[data-contraste=fort] .soleil{background:#fff;color:#00316f;border-color:#fff}

/* ---- Blocs ---- */
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:var(--rayon);
  padding:15px;margin:13px 0;box-shadow:var(--ombre-douce)}
html[data-contraste=fort] .carte{border-width:2px}
.carte.plate{box-shadow:none;background:var(--surface-douce)}
.carte.teintee{background:var(--t-pale);border-color:var(--t)}
.encadre{border-left:6px solid var(--sable);background:var(--sable-pale);color:#402b09;
  border-radius:var(--rayon-petit);padding:12px 14px;margin:13px 0;font-size:.95rem}
.encadre b{color:#8a5a10}
.encadre.info{border-left-color:var(--primaire);background:var(--primaire-pale);color:#122c52}
.encadre.info b{color:var(--primaire)}
.consigne{background:var(--surface-douce);border:1px dashed var(--trait-fort);border-radius:var(--rayon-petit);
  padding:11px 13px;font-size:.9rem;margin:.7em 0}
.enonce{font-size:1.3rem;font-weight:700;line-height:1.28;margin:.35em 0 .65em;letter-spacing:-.015em}
.enonce.grand{font-size:1.45rem;line-height:1.32}
.qui-entretien{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.qui-entretien span{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;
  background:var(--surface);border:1.5px solid var(--trait-fort);color:var(--encre-douce)}

/* ---- Pictogrammes ---- */
.pic{width:1.15em;height:1.15em;flex:0 0 auto;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.medaillon{flex:0 0 auto;width:46px;height:46px;border-radius:14px;background:var(--surface);
  border:2px solid var(--t);color:var(--t);display:flex;align-items:center;justify-content:center}
.medaillon .pic{width:25px;height:25px;stroke-width:1.9}
.medaillon.petit{width:34px;height:34px;border-radius:10px}
.medaillon.petit .pic{width:19px;height:19px}

/* ---- En-tête de question ---- */
.entete-question{display:flex;gap:13px;align-items:center;background:var(--t-pale);
  border:1px solid var(--t);border-left-width:6px;border-radius:var(--rayon);padding:12px 14px;margin:6px 0 14px}
.entete-question .infos{min-width:0}
.entete-question .rang{display:block;font-size:.76rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.07em;color:var(--t)}
.entete-question .titre{display:block;font-size:1.06rem;font-weight:800;line-height:1.2}
.entete-question .sujet{display:block;font-size:.85rem;color:var(--encre-douce);margin-top:2px}

/* ---- Illustration ---- */
.illustration{display:block;width:100%;height:auto;border-radius:var(--rayon);border:1px solid var(--trait);
  box-shadow:var(--ombre-douce)}
html[data-contraste=fort] .illustration{display:none}

/* ---- Formulaires ---- */
label.champ,legend.champ{display:block;font-weight:700;margin:.95em 0 .3em;font-size:.95rem;padding:0}
fieldset.groupe{border:0;margin:0;padding:0;min-width:0}
input[type=text],input[type=date],textarea{width:100%;font:inherit;padding:13px;
  border:var(--bord) solid var(--trait-fort);border-radius:var(--rayon-petit);background:var(--surface);color:var(--encre)}
textarea{min-height:80px;resize:vertical}
/* L'anneau de focus suit le clavier, pas le doigt : un appui sur une réponse ne l'encadre pas de bleu. */
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{
  outline:3px solid var(--primaire);outline-offset:2px}
label.option:has(input:focus-visible){outline:3px solid var(--primaire);outline-offset:2px}

/* ---- Boutons ---- */
button{font:inherit;cursor:pointer}
button,label,summary,a{-webkit-tap-highlight-color:transparent}
.bouton{display:block;width:100%;padding:15px 16px;margin:10px 0;border-radius:var(--rayon-petit);
  border:var(--bord) solid var(--primaire);background:var(--primaire);color:#fff;
  font-weight:700;font-size:1rem;text-align:center;text-decoration:none;box-shadow:var(--ombre-douce)}
.bouton{transition:background-color .15s ease,color .15s ease,border-color .15s ease,transform .1s ease}
.bouton:active{transform:scale(.98)}
.bouton.secondaire{background:var(--surface);color:var(--primaire)}
.bouton.danger{background:var(--surface);color:var(--rouge);border-color:var(--rouge)}
.bouton.petit{padding:10px 12px;font-size:.9rem;margin:6px 0}
.bouton.avecPic{display:flex;align-items:center;justify-content:center;gap:9px}
.bouton:disabled{opacity:.4;cursor:not-allowed}
.bouton.pret{animation:pret 1s ease-out 1}
@keyframes pret{0%{box-shadow:0 0 0 0 rgba(31,79,143,.55)}100%{box-shadow:0 0 0 14px rgba(31,79,143,0)}}
.bouton.fait:disabled{opacity:1;cursor:default;color:var(--vert);border-color:var(--vert);background:var(--vert-pale)}
.rangee{display:flex;gap:10px;flex-wrap:wrap}
.rangee>*{flex:1 1 130px;width:auto;margin:6px 0}
.grille2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---- Options ---- */
.options{margin:.5em 0}
.option{display:flex;gap:12px;align-items:flex-start;position:relative;
  border:var(--bord) solid var(--trait);border-radius:var(--rayon-petit);
  padding:14px 14px 14px 12px;margin:9px 0;background:var(--surface);cursor:pointer;box-shadow:var(--ombre-douce);
  transition:border-color .15s ease,background-color .15s ease,box-shadow .15s ease,transform .1s ease}
.option:active{transform:scale(.985)}
.option:has(input:checked){border-color:var(--t);background:var(--t-pale);box-shadow:inset 5px 0 0 var(--t)}
.option input{position:absolute;opacity:0;width:1px;height:1px}
.marque{flex:0 0 auto;width:26px;height:26px;margin-top:1px;border:var(--bord) solid var(--trait-fort);
  background:var(--surface);display:flex;align-items:center;justify-content:center}
.option input[type=radio]+.marque{border-radius:50%}
.option input[type=checkbox]+.marque{border-radius:7px}
.marque::after{content:"";width:12px;height:12px;border-radius:inherit;background:transparent}
.option input:checked+.marque{border-color:var(--t)}
.option input:checked+.marque::after{background:var(--t)}
.option input[type=checkbox]:checked+.marque::after{width:14px;height:8px;border-radius:0;background:transparent;
  border-left:3px solid var(--t);border-bottom:3px solid var(--t);transform:rotate(-45deg) translate(1px,-2px)}
.option .texte{flex:1;min-width:0;font-weight:600;line-height:1.35}
.option .sous{display:block;font-size:.86rem;color:var(--encre-douce);font-weight:400;margin-top:3px}
.option .note{display:block;font-size:.8rem;color:var(--orange);font-weight:700;margin-top:4px}
.option.choix{align-items:center;padding:12px 14px 12px 12px;margin:8px 0}
.option.choix .marque{margin-top:0}
.option-pic{flex:0 0 auto;display:flex;color:var(--encre-douce)}
.option-pic .pic{width:26px;height:26px}
.option:has(input:checked) .option-pic{color:var(--t)}

/* ---- Progression ---- */
/* La zone à toucher fait 30 px de haut ; seule la barre du milieu est dessinée. */
.pastilles{display:flex;gap:5px;margin:0 0 6px}
.pastille{flex:1;min-width:0;height:30px;padding:0;border:0;background:none;position:relative;cursor:pointer}
.pastille::before{content:"";position:absolute;left:0;right:0;top:9px;height:12px;border-radius:999px;
  background:#e3d9c9;border:1px solid transparent;transition:background-color .2s ease}
.pastille.complet::before{background:var(--primaire)}
.pastille.partiel::before{background:var(--sable)}
.pastille.courant::before{border-color:var(--encre);box-shadow:0 0 0 2px var(--fond),0 0 0 4px var(--encre)}
.fil{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.86rem;color:var(--encre-douce)}
.fil b{color:var(--encre);font-size:.95rem}

/* ---- Questions à plusieurs points ---- */
.volet{scroll-margin-top:10px;transition:border-color .2s ease}
.volet h3{display:flex;align-items:center;justify-content:space-between;gap:10px}
.volet .badge-fait{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:50%;background:var(--t);color:#fff;transform:scale(0);transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
.volet .badge-fait .pic{width:16px;height:16px;stroke-width:3}
.volet.fait{border-color:var(--t)}
.volet.fait .badge-fait{transform:scale(1)}

/* ---- Note libre, repliée tant qu'elle est vide ---- */
.note-libre{padding:0 15px}
.note-libre summary{display:flex;align-items:center;gap:9px;padding:14px 0;font-weight:700;color:var(--primaire);
  cursor:pointer;list-style:none}
.note-libre summary::-webkit-details-marker{display:none}
.note-libre summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid currentColor;
  border-bottom:2.5px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .2s ease}
.note-libre[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.note-libre summary .petit{font-weight:400}
.note-libre small{display:block;margin:6px 0 14px}

/* ---- Barre basse ---- */
.barre-bas{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:var(--bord) solid var(--trait);box-shadow:0 -4px 18px rgba(60,40,20,.10)}
.barre-bas .dedans{max-width:760px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.barre-bas .rangee{flex-wrap:nowrap}
.barre-bas .rangee>*{margin:0;flex:1 1 0;min-width:0}
.barre-bas .rangee>.large{flex-grow:1.45}
.barre-bas .rangee>.icone{flex:0 0 58px}
.barre-bas .bouton{margin:0;padding:15px 6px;font-size:.93rem}
.bouton.icone{display:flex;align-items:center;justify-content:center}
.bouton.icone .pic{width:1.5em;height:1.5em;stroke-width:2.2}

/* ---- Résultat ---- */
.hero{border-radius:var(--rayon);padding:18px 16px;margin:6px 0 14px;color:#fff;
  background:linear-gradient(135deg,#1f4f8f,#153a6d);box-shadow:var(--ombre)}
.hero.recommande{background:linear-gradient(135deg,#1b7a45,#12522f)}
.hero.approfondir{background:linear-gradient(135deg,#b97514,#8a5410)}
.hero.non_recommande{background:linear-gradient(135deg,#a8202a,#7a0f16)}
.hero .dedans{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .texte{flex:1 1 170px;min-width:0}
.hero .verdict-titre{font-size:1.25rem;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:9px}
.hero .verdict-detail{font-size:.88rem;margin-top:6px;color:rgba(255,255,255,.92)}
.hero .qui{font-size:.8rem;color:rgba(255,255,255,.8);margin-bottom:8px}
html[data-contraste=fort] .hero{background:#fff;color:#000;border:3px solid #000}
html[data-contraste=fort] .hero .verdict-detail,html[data-contraste=fort] .hero .qui{color:#1c1917}
.anneau{flex:0 0 auto}
.anneau .valeur{font-size:30px;font-weight:800;fill:currentColor}
.anneau .sur{font-size:11px;fill:currentColor;opacity:.82;font-weight:600}

.sous-score{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--trait)}
.sous-score:last-child{border-bottom:0}
.sous-score .corps{flex:1;min-width:0}
.sous-score .ligne{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.98rem}
.sous-score .ligne em{font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--t)}
.sous-score .resume{display:block;font-size:.82rem;color:var(--encre-douce);margin-top:2px}
.jauge{height:11px;background:#e3d9c9;border-radius:999px;overflow:hidden;margin-top:7px;border:1px solid var(--trait)}
.jauge i{display:block;height:100%;border-radius:999px;background:var(--t);transition:width .9s cubic-bezier(.2,.7,.3,1)}

.drapeau{border-radius:var(--rayon-petit);padding:13px 14px;margin:10px 0;border:var(--bord) solid;display:flex;gap:12px;box-shadow:var(--ombre-douce)}
.drapeau .pic{width:26px;height:26px;stroke-width:1.9;margin-top:1px}
.drapeau.bloquant{background:var(--rouge-pale);border-color:var(--rouge);color:var(--rouge)}
.drapeau.leger{background:var(--orange-pale);border-color:var(--orange);color:var(--orange)}
.etiquette{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 9px;border-radius:999px;border:1.5px solid currentColor}
.drapeau .message{display:block;margin-top:6px;font-weight:600;line-height:1.38;color:var(--encre)}

ul.verifs{list-style:none;padding:0;margin:.4em 0}
ul.verifs li{position:relative;padding:11px 0 11px 34px;border-bottom:1px solid var(--trait);line-height:1.4}
ul.verifs li:last-child{border-bottom:0}
ul.verifs li::before{content:"";position:absolute;left:2px;top:13px;width:18px;height:18px;
  border:2px solid var(--trait-fort);border-radius:5px;background:var(--surface)}
.detail-reponses summary{cursor:pointer;font-weight:700;color:var(--primaire);padding:10px 0}
.detail-reponses dl{margin:0}
.detail-reponses dt{font-weight:700;font-size:.93rem;margin-top:15px;display:flex;gap:8px;align-items:center;color:var(--t)}
.detail-reponses dd{margin:3px 0 0;color:var(--encre);font-size:.92rem;padding-left:26px}
.detail-reponses .sujet{display:block;font-size:.8rem;color:var(--encre-douce);font-weight:400}

table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6em 0}
th,td{border:1px solid var(--trait);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--surface-douce);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}

.liste{list-style:none;padding:0;margin:0}
.liste li{border:var(--bord) solid var(--trait);border-radius:var(--rayon-petit);padding:13px;margin:10px 0;
  background:var(--surface);box-shadow:var(--ombre-douce)}
.liste.sommaire li{border:0;padding:0;margin:9px 0;background:none;box-shadow:none}
.liste.sommaire .bouton{display:flex;align-items:center;gap:11px;text-align:left;padding:12px 13px;
  border-color:var(--t);color:var(--encre)}
.liste.sommaire .bouton .infos{flex:1;min-width:0}
.liste.sommaire .bouton b{display:block;font-size:.97rem;line-height:1.2}
.liste.sommaire .bouton .sujet{display:block;font-size:.78rem;color:var(--encre-douce);font-weight:400;margin-top:2px}
.chip{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;
  border:1.5px solid;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.chip.recommande{color:var(--vert);border-color:var(--vert);background:var(--vert-pale)}
.chip.approfondir{color:var(--orange);border-color:var(--orange);background:var(--orange-pale)}
.chip.non_recommande{color:var(--rouge);border-color:var(--rouge);background:var(--rouge-pale)}
.chip.vide{color:var(--encre-douce);border-color:var(--trait-fort);background:var(--surface-douce)}
.chip.complet{color:var(--vert);border-color:var(--vert);background:var(--vert-pale)}
.chip.partiel{color:var(--orange);border-color:var(--orange);background:var(--orange-pale)}

pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-douce);padding:10px;border-radius:8px;font-size:.8rem}
.ok{color:var(--vert);font-weight:800}
.ko{color:var(--rouge);font-weight:800}

/* ---- Dialogues et annonces (à la place des fenêtres du navigateur) ---- */
.voile{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:rgba(28,25,23,.52);
  display:flex;align-items:flex-end;justify-content:center;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));animation:fondu .18s ease-out}
.voile.sortie{animation:disparaitre .16s ease-in forwards}
.dialogue{width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);color:var(--encre);
  border-radius:20px;padding:20px 18px 12px;box-shadow:0 18px 50px rgba(0,0,0,.3);animation:monter .26s cubic-bezier(.2,.7,.3,1)}
.dialogue:focus{outline:none}
.dialogue h2{margin:0 0 .35em;font-size:1.2rem;line-height:1.25}
.dialogue p{margin:.3em 0 .7em;color:var(--encre-douce)}
.dialogue .dlg-liste{margin:.2em 0 .9em;padding-left:1.25em;font-weight:700}
.dialogue .dlg-liste li{margin:.2em 0}
.dialogue .bouton{margin:9px 0}
html[data-contraste=fort] .dialogue{border:3px solid #000}
@media (min-width:640px){ .voile{align-items:center} }

.annonce{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));z-index:30;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);width:max-content;
  display:flex;align-items:center;gap:9px;background:#1c1917;color:#fff;border-radius:999px;padding:11px 18px;
  font-weight:700;font-size:.92rem;line-height:1.3;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .2s ease,transform .2s ease}
.annonce.visible{opacity:1;transform:translate(-50%,0)}
.annonce .pic{color:#86e0aa;width:1.3em;height:1.3em;stroke-width:2.4}
.annonce:empty{display:none}

/* ---- Mouvement ---- */
.enveloppe.entree{animation:apparaitre .22s ease-out}
.enveloppe.entree-avant{animation:glisserAvant .26s cubic-bezier(.2,.7,.3,1)}
.enveloppe.entree-arriere{animation:glisserArriere .26s cubic-bezier(.2,.7,.3,1)}
.option.coche-anim .marque{animation:rebond .28s ease-out}
@keyframes apparaitre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes glisserAvant{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes glisserArriere{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes rebond{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes disparaitre{from{opacity:1}to{opacity:0}}
@keyframes monter{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}

@media (min-width:640px){ :root{--base:18px} .enveloppe{padding:20px 20px 122px} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}

@media print{
  .bandeau,.barre-bas,.sansImpression,.voile,.annonce{display:none !important}
  body{font-size:11pt;background:#fff;background-image:none}
  .enveloppe{max-width:none;padding:0}
  .carte,.drapeau,.hero,.sous-score{break-inside:avoid;box-shadow:none}

  .hero{background:#fff !important;color:#000;border:2px solid #333}
  .hero .verdict-detail,.hero .qui{color:#333}
  .anneau .valeur{fill:#000}.anneau .sur{fill:#333}
  .detail-reponses summary{display:none}
  h2{margin-top:14pt}
  a[href]:after{content:""}
}

/* Certaines questions posent des critères différents selon une donnée du poste (ex. Disponibilité selon que
   la candidate loge sur place ou rentre chaque soir — jamais selon la situation familiale). `source` est
   soit les réponses transmises au calcul (poste, logement…), soit `etat.identite` côté interface :
   dans les deux cas, un simple objet portant les mêmes noms de champs. */
function criteresDe(question, source) {
  if (!question.branches) return question.criteres || [];
  const cle = (source && source[question.brancheSur]) || question.brancheParDefaut;
  return question.branches[cle] || question.branches[question.brancheParDefaut] || [];
}

/* Calcul du score. Fonction pure : mêmes entrées, même sortie.
   Sortie : { total, sousScores, drapeaux, verdict, pointsAVerifier } — voir docs/SPEC.md § 8. */
function computeScore(answers, config) {
  const entree = answers || {};
  const ponderations = config.ponderations || {};
  const poste = ponderations[entree.poste] ? entree.poste : 'polyvalent';
  const reponses = entree.reponses || {};
  const gestesSaisis = entree.pratique || {};

  const acc = {};
  config.sousScores.forEach(function (s) { acc[s.id] = { obtenus: 0, max: 0 }; });
  const drapeaux = [];
  const pointsAVerifier = [];

  function ajouterVerif(texte) {
    if (texte && pointsAVerifier.indexOf(texte) === -1) pointsAVerifier.push(texte);
  }

  // Un barème peut valoir un nombre, ou un nombre par poste. null = hors périmètre du poste.
  function resoudre(valeur) {
    if (typeof valeur === 'number') return valeur;
    if (valeur && typeof valeur === 'object') {
      const v = valeur[poste];
      return typeof v === 'number' ? v : null;
    }
    return null;
  }

  function ajouterDrapeau(drapeau, contexte) {
    if (!drapeau) return;
    const dico = (config.drapeaux || {})[drapeau.id] || {};
    const base = dico[drapeau.niveau] || drapeau.id;
    drapeaux.push({
      id: drapeau.id,
      niveau: drapeau.niveau,
      message: contexte ? base + ' Point concerné : ' + contexte + '.' : base
    });
  }

  /* Un critère = une série d'options concurrentes dont une seule est retenue.
     Le maximum applicable est le meilleur score possible du critère ; une option marquée
     « nonPosee », ou l'absence de réponse, retire le critère du maximum sans pénaliser la candidate. */
  function appliquerCritere(critere, optionId, contexte) {
    if (!critere) return null;
    const options = critere.options || [];
    let choisie = null;
    options.forEach(function (o) { if (o.id === optionId) choisie = o; });
    if (!choisie || choisie.nonPosee) return null;

    const cles = {};
    options.forEach(function (o) {
      if (o.nonPosee || !o.points) return;
      Object.keys(o.points).forEach(function (k) { cles[k] = true; });
    });

    let auMaximum = true;
    Object.keys(cles).forEach(function (k) {
      if (!acc[k]) return;
      let max = 0;
      options.forEach(function (o) {
        if (o.nonPosee) return;
        const v = resoudre(o.points ? o.points[k] : null);
        if (v !== null && v > max) max = v;
      });
      const obtenu = resoudre(choisie.points ? choisie.points[k] : null) || 0;
      acc[k].max += max;
      acc[k].obtenus += obtenu;
      if (obtenu < max) auMaximum = false;
    });

    ajouterDrapeau(choisie.drapeau, contexte);
    ajouterVerif(choisie.aVerifier);
    ajouterVerif(critere.aVerifierToujours);
    if (!auMaximum || choisie.drapeau) ajouterVerif(critere.aVerifier);
    return choisie;
  }

  (config.questions || []).forEach(function (question) {
    const rep = reponses[question.id] || {};

    if (question.type === 'competences') {
      const cochees = Array.isArray(rep.familles) ? rep.familles : [];
      (question.familles || []).forEach(function (famille) {
        const points = famille.points || {};
        Object.keys(points).forEach(function (k) {
          if (!acc[k]) return;
          const v = resoudre(points[k]);
          if (v === null) return;
          acc[k].max += v;
          if (cochees.indexOf(famille.id) !== -1) acc[k].obtenus += v;
        });
        if (cochees.indexOf(famille.id) !== -1 && famille.id !== rep.famille) ajouterVerif(famille.aVerifier);
      });
      // La tâche expliquée doit faire partie de celles qu'elle a cochées ; sinon l'explication ne compte pas.
      if (rep.famille && cochees.indexOf(rep.famille) !== -1) {
        appliquerCritere(question.demonstration, rep.explication, null);
      }
      return;
    }

    if (question.type === 'criteres') {
      criteresDe(question, entree).forEach(function (critere) {
        appliquerCritere(critere, rep[critere.id], critere.titre);
      });
      return;
    }

    if (question.type === 'variantes') {
      let variante = null;
      (question.variantes || []).forEach(function (v) { if (v.id === rep.variante) variante = v; });
      appliquerCritere(variante, rep.option, variante ? variante.libelle : null);
    }
  });

  // Épreuve pratique : « non observé » et non renseigné sortent du calcul.
  // Si aucun geste n'a été observé, le rapport demande de la faire avant de décider.
  const reglagePratique = config.pratique || {};
  const notes = reglagePratique.notes || {};
  let pratiqueObtenus = 0;
  let pratiqueMax = 0;
  (reglagePratique.gestes || []).forEach(function (geste) {
    const note = gestesSaisis[geste.id];
    const valeur = notes[note];
    if (typeof valeur !== 'number') return;
    const coef = (geste.coefficients || {})[poste] || 0;
    if (!coef) return;
    pratiqueObtenus += coef * valeur;
    pratiqueMax += coef * (notes.reussi || 0);
    if (note !== 'reussi') ajouterVerif('Reprendre « ' + geste.libelle + ' » le premier jour.');
  });
  if (pratiqueMax === 0) ajouterVerif(reglagePratique.aVerifierSiAbsente);

  const sousScores = {};
  config.sousScores.forEach(function (s) {
    const a = acc[s.id];
    const valeur = a.max > 0 ? Math.round((a.obtenus / a.max) * 100) : config.neutre;
    sousScores[s.id] = Math.max(0, Math.min(100, valeur));
  });

  if (pratiqueMax > 0 && typeof sousScores.competences === 'number') {
    const notePratique = Math.round((pratiqueObtenus / pratiqueMax) * 100);
    const melange = sousScores.competences * (reglagePratique.partEntretien || 0) +
                    notePratique * (reglagePratique.partPratique || 0);
    sousScores.competences = Math.max(0, Math.min(100, Math.round(melange)));
  }

  const pond = ponderations[poste];
  let total = 0;
  config.sousScores.forEach(function (s) { total += sousScores[s.id] * (pond[s.id] || 0); });
  total = Math.max(0, Math.min(100, Math.round(total / 100)));

  const seuils = config.seuils || {};
  let verdict = 'non_recommande';
  if (total >= seuils.recommande) verdict = 'recommande';
  else if (total >= seuils.approfondir) verdict = 'approfondir';

  let bloquants = 0;
  let legers = 0;
  drapeaux.forEach(function (d) {
    if (d.niveau === 'bloquant') bloquants++;
    else if (d.niveau === 'leger') legers++;
  });

  const plafonnement = config.plafonnement || {};
  if (bloquants >= (plafonnement.bloquantsNonRecommande || 2)) verdict = 'non_recommande';
  else if ((bloquants >= 1 || legers >= (plafonnement.legersApprofondir || 3)) && verdict === 'recommande') verdict = 'approfondir';

  drapeaux.sort(function (a, b) {
    if (a.niveau === b.niveau) return 0;
    return a.niveau === 'bloquant' ? -1 : 1;
  });

  (config.verifsSystematiques || []).forEach(ajouterVerif);

  return { total: total, sousScores: sousScores, drapeaux: drapeaux, verdict: verdict, pointsAVerifier: pointsAVerifier };
}
// @@SCORING-END

const PRATIQUE_REUSSIE = { g1: 'reussi', g2: 'reussi', g3: 'reussi', g4: 'reussi', g5: 'reussi' };

function candidate(poste, modifications, pratique, logement) {
  const reponses = reponsesSolides();

  // reponsesSolides() décrit une candidate qui rentre chez elle chaque soir ; les cas qui veulent
  // la variante « loge sur place » passent logement: 'reside' en 4e argument.
  const answers = { poste: poste, logement: logement || 'externe', reponses: reponses };
  if (pratique) answers.pratique = pratique;
  return answers;
}

function esc(valeur) {
  return String(valeur === null || valeur === undefined ? '' : valeur)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* Stockage local : toujours sous try/catch, l'app reste utilisable sans lui. */
function lireStockage(cle, defaut) {
  try {
    const brut = localStorage.getItem(cle);
    return brut ? JSON.parse(brut) : defaut;
  } catch (e) {
    return defaut;
  }
}
function ecrireStockage(cle, valeur) {
  try { localStorage.setItem(cle, JSON.stringify(valeur)); return true; }
  catch (e) { return false; }
}
function stockageDisponible() {
  try { localStorage.setItem('rem.test', '1'); localStorage.removeItem('rem.test'); return true; }
  catch (e) { return false; }
}

function aujourdhui() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function reponsesVides() {

  });

}

  };
}

let etat = etatInitial();

function hasard(liste) { return liste[Math.floor(Math.random() * liste.length)]; }

function tirerVariantes(seulement) {
  CONFIG.questions.forEach(function (q) {
    if (q.type !== 'variantes') return;
    if (seulement && q.id !== seulement) return;
    const autres = q.variantes.filter(function (v) { return v.id !== (etat.reponses[q.id] || {}).variante; });
    const variante = hasard(autres.length ? autres : q.variantes);
    etat.reponses[q.id] = { variante: variante.id, option: null, note: (etat.reponses[q.id] || {}).note };
  });
}

/* Compétences : la tâche à expliquer est tirée parmi les familles cochées, en priorité la cuisine pour les
   postes qui cuisinent. `autre` demande une tâche différente de celle déjà tirée. */
function tirerTache(question, autre) {
  const rep = etat.reponses[question.id];
  const cochees = rep.familles || [];
  const familles = question.familles.filter(function (f) { return cochees.indexOf(f.id) !== -1; });
  rep.explication = null;
  if (!familles.length) { rep.famille = null; rep.tache = null; return; }
  const prioritaires = familles.filter(function (f) {
    return (f.prioritaireDemonstration || []).indexOf(etat.identite.poste) !== -1;
  });
  const reserve = prioritaires.length ? prioritaires : familles;
  function restantes(f) { return f.demonstrations.filter(function (t) { return !autre || t !== rep.tache; }); }
  const possibles = reserve.filter(function (f) { return restantes(f).length; });
  const famille = hasard(possibles.length ? possibles : reserve);
  rep.famille = famille.id;
  rep.tache = hasard(restantes(famille).length ? restantes(famille) : famille.demonstrations);
}

let minuteurSauvegarde = null;

function entretienCommence() {
  if (etat.ecran === 'entretien' || etat.ecran === 'pratique' || etat.ecran === 'resultat') return true;
  return CONFIG.questions.some(function (q) { return etatQuestion(q) !== 'vide'; });
}

function sauverBrouillon() {
  if (!entretienCommence() || etat.ecran === 'resultat') return;
  ecrireStockage(CLES.brouillon, {
    enregistreLe: new Date().toISOString(),
    identite: etat.identite, reponses: etat.reponses,
    pratique: etat.pratique, pratiqueFaite: etat.pratiqueFaite, index: etat.index
  });
}
function planifierSauvegarde() {
  clearTimeout(minuteurSauvegarde);
  minuteurSauvegarde = setTimeout(sauverBrouillon, 350);
}

/* ---------- État de chaque question ---------- */

function etatQuestion(question) {
  const rep = etat.reponses[question.id] || {};
  if (question.type === 'competences') {
    if (!(rep.familles || []).length) return 'vide';
    return rep.explication ? 'complet' : 'partiel';
  }
  if (question.type === 'variantes') return rep.option ? 'complet' : 'vide';
  if (question.type === 'criteres') {
    const criteres = criteresDe(question, etat.identite);
    const faits = criteres.filter(function (c) { return rep[c.id]; }).length;
    if (!faits) return 'vide';
    return faits === criteres.length ? 'complet' : 'partiel';
  }
  return 'vide';
}

function varianteDe(question, rep) {
  return question.variantes.filter(function (v) { return v.id === (rep || {}).variante; })[0] || null;
}
function libelleOption(options, id) {
  const o = (options || []).filter(function (x) { return x.id === id; })[0];
  return o ? o.libelle : null;
}

/* `sens` règle l'entrée du nouvel écran : 'avant' (glisse depuis la droite), 'arriere' (depuis la gauche),
   sinon un simple fondu. Les animations disparaissent si le téléphone demande moins de mouvement. */
function rendre(sens) {
  theme('bleu');
  (ECRANS[etat.ecran] || rendreAccueil)();
  appliquerAffichage();
  planifierSauvegarde();
  try { scrollTo(0, 0); } catch (e) { /* sans effet hors navigateur */ }
  animerEntree(sens);
}
function aller(ecran, sens) { etat.ecran = ecran; rendre(sens); }

function animerEntree(sens) {
  const classe = sens === 'avant' ? 'entree-avant' : (sens === 'arriere' ? 'entree-arriere' : 'entree');
  $ecran.classList.remove('entree', 'entree-avant', 'entree-arriere');
  void $ecran.offsetWidth;
  $ecran.classList.add(classe);
}

/* Petit rebond de la case qu'on vient de cocher : confirme le geste sans attendre. */
function marquerChoix(entree) {
  const option = entree && entree.closest ? entree.closest('.option') : null;
  if (!option || !entree.checked) return;
  option.classList.remove('coche-anim');
  void option.offsetWidth;
  option.classList.add('coche-anim');
}

function brancher(selecteur, evenement, action) {
  $ecran.querySelectorAll(selecteur).forEach(function (n) { n.addEventListener(evenement, action); });
  $barre.querySelectorAll(selecteur).forEach(function (n) { n.addEventListener(evenement, action); });
}
function surClic(id, action) {
  const n = document.getElementById(id);
  if (n) n.addEventListener('click', action);
}

function mouvementReduit() {
  try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
}

/* ---------- Dialogues et annonces ----------
   Remplacent confirm() et alert() : les fenêtres du navigateur affichent l'adresse du site,
   coupent l'entretien et ne se lisent pas bien au soleil.
   dialogue({ titre, message, liste, actions: [{ id, libelle, style }] }) → Promise du choix (null si on ferme). */

function dialogue(reglage) {
  return new Promise(function (resoudre) {
    const precedent = document.activeElement;
    const autour = [document.querySelector('.bandeau'), $ecran, $barre];
    const voile = document.createElement('div');
    voile.className = 'voile';

    let html = '<div class="dialogue" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="dlg-titre"' +
      (reglage.message ? ' aria-describedby="dlg-message"' : '') + '>' +
      '<h2 id="dlg-titre">' + esc(reglage.titre) + '</h2>';
    if (reglage.message) html += '<p id="dlg-message">' + esc(reglage.message) + '</p>';
    if (reglage.liste && reglage.liste.length) {
      html += '<ul class="dlg-liste">' + reglage.liste.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }
    (reglage.actions || []).forEach(function (a) {
      html += '<button type="button" class="bouton' + (a.style ? ' ' + esc(a.style) : '') + '" data-choix="' + esc(a.id) + '">' +
        esc(a.libelle) + '</button>';
    });
    voile.innerHTML = html + '</div>';
    document.body.appendChild(voile);
    autour.forEach(function (n) { if (n) n.setAttribute('inert', ''); });

    function clavier(e) { if (e.key === 'Escape') { e.preventDefault(); fermer(null); } }
    function fermer(choix) {
      document.removeEventListener('keydown', clavier);
      autour.forEach(function (n) { if (n) n.removeAttribute('inert'); });
      voile.classList.add('sortie');
      setTimeout(function () { if (voile.parentNode) voile.parentNode.removeChild(voile); }, mouvementReduit() ? 0 : 160);
      try { if (precedent && document.body.contains(precedent)) precedent.focus(); } catch (e) { /* rien à refaire */ }
      resoudre(choix);
    }
    document.addEventListener('keydown', clavier);
    voile.addEventListener('click', function (e) {
      const bouton = e.target.closest('[data-choix]');
      if (bouton) fermer(bouton.getAttribute('data-choix'));
      else if (e.target === voile) fermer(null);
    });
    voile.querySelector('.dialogue').focus();
  });
}

function prevenir(titre, message) {
  return dialogue({ titre: titre, message: message, actions: [{ id: 'ok', libelle: 'D’accord' }] });
}

let minuteurAnnonce = null;
function annoncer(texte) {
  const n = document.getElementById('annonce');
  if (!n) return;
  n.innerHTML = pic('coche') + '<span>' + esc(texte) + '</span>';
  n.classList.remove('visible');
  void n.offsetWidth;
  n.classList.add('visible');
  clearTimeout(minuteurAnnonce);
  minuteurAnnonce = setTimeout(function () {
    n.classList.remove('visible');
    // Une fois l'annonce effacée, on vide la zone pour qu'un lecteur d'écran ne la relise pas plus tard.
    minuteurAnnonce = setTimeout(function () { n.innerHTML = ''; }, 250);
  }, 2600);
}

  html += '<fieldset class="groupe"><legend class="champ">Poste visé</legend>';
  CONFIG.postes.forEach(function (p) { html += choixHtml('poste', p, id.poste); });
  html += '</fieldset>';
  html += '<fieldset class="groupe"><legend class="champ">Logement</legend>';
  CONFIG.logements.forEach(function (l) { html += choixHtml('logement', l, id.logement); });
  const questionLogement = CONFIG.questions.filter(function (q) { return q.brancheSur === 'logement'; })[0];
  if (questionLogement) {
    html += '<small>Change les questions posées sur la ' + esc(questionLogement.titre.toLowerCase()) +
      ' (question ' + questionLogement.numero + ').</small>';
  }
  html += '</fieldset>';
  html += '<label class="champ" for="date">Date de l’entretien</label><input type="date" id="date" value="' + esc(id.date) + '">';
  html += '<label class="champ" for="note">Note libre (facultatif)</label>' +
    '<textarea id="note" placeholder="Ce que tu veux retenir.">' + esc(id.note) + '</textarea>' +
    '<small>Aucun numéro de pièce d’identité, aucune photo. Rien de ce qui est écrit ici n’entre dans le calcul.</small>';
  html += '</div>';

  html += '<div class="rangee sansImpression">' +
    '<button class="bouton secondaire avecPic" data-aller="historique">' + pic('archive') + 'Historique</button>' +
    '<button class="bouton secondaire avecPic" data-aller="reglages">' + pic('reglages') + 'Réglages</button></div>';

  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><button class="bouton avecPic" id="commencer">Commencer l’entretien' + pic('droite') + '</button></div>';

  ['prenom', 'note'].forEach(function (cle) {
    const champ = document.getElementById(cle);
    if (champ) champ.addEventListener('input', function () { etat.identite[cle] = champ.value; planifierSauvegarde(); });
  });
  const date = document.getElementById('date');
  if (date) date.addEventListener('change', function () { etat.identite.date = date.value; planifierSauvegarde(); });
  brancher('input[name=poste], input[name=logement]', 'change', function (e) {
    etat.identite[e.currentTarget.name] = e.currentTarget.value;
    marquerChoix(e.currentTarget);
    planifierSauvegarde();
  });
  // « Entrée » ferme le clavier au lieu de ne rien faire.

  if (prenom) prenom.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); prenom.blur(); } });
  brancher('[data-aller]', 'click', function (e) { aller(e.currentTarget.getAttribute('data-aller')); });

  function reprendre() {
    etat = Object.assign(etatInitial(), {
      identite: Object.assign(etatInitial().identite, brouillon.identite),
      reponses: Object.assign(etatInitial().reponses, brouillon.reponses),
      pratique: brouillon.pratique || {},
      pratiqueFaite: !!brouillon.pratiqueFaite,
      index: brouillon.index || 0
    });

    etat = etatInitial();

    tirerVariantes();
    aller('preambule', 'avant');

  surClic('reprendre', reprendre);
  surClic('jeter', function () {
    dialogue({
      titre: 'Supprimer ce brouillon ?',

      rendre();
      annoncer('Brouillon supprimé');

  surClic('commencer', function () {
    if (!brouillon || !brouillon.identite) { demarrer(); return; }
    dialogue({
      titre: 'Un entretien est déjà en cours',
      message: 'Celui de ' + (brouillon.identite.prenom || 'la candidate précédente') +
        ' n’est pas terminé. Commencer un nouvel entretien effacera son brouillon.',
      actions: [

        { id: 'nouveau', libelle: 'Commencer un nouvel entretien', style: 'danger' },
        { id: 'annuler', libelle: 'Annuler', style: 'secondaire' }
      ]
    }).then(function (choix) {
      if (choix === 'reprendre') reprendre();
      else if (choix === 'nouveau') demarrer();
    });
  });
}

/* ---------- Entretien ---------- */

function rendreEntretien() {
  const question = CONFIG.questions[etat.index];
  theme(question.couleur);
  const total = CONFIG.questions.length;
  const rep = etat.reponses[question.id] || {};
  let html = '';

  html += '<div class="pastilles sansImpression">';
  CONFIG.questions.forEach(function (q, position) {
    html += '<button class="pastille ' + etatQuestion(q) + (position === etat.index ? ' courant' : '') +
      '" data-question="' + position + '" title="' + esc(q.numero + '. ' + q.titre) + '" aria-label="' + esc(q.numero + '. ' + q.titre) + '"></button>';
  });
  html += '</div>';
  html += '<div class="entete-question">' + medaillon(question.icone) +
    '<span class="infos"><span class="rang">Question ' + (etat.index + 1) + ' sur ' + total + '</span>' +
    '<span class="titre">' + esc(question.titre) + '</span>' +
    '<span class="sujet">' + esc(question.sujet) + '</span></span></div>';

  if (question.type === 'competences') {
    html += '<p class="enonce">' + esc(question.texte) + '</p>';
    if (question.consigne) html += '<p class="consigne">' + esc(question.consigne) + '</p>';
    html += '<div class="options">';
    question.familles.forEach(function (f) {
      const horsPoste = f.points.competences[etat.identite.poste] === null;
      html += '<label class="option"><input type="checkbox" data-famille="' + esc(f.id) + '"' +
        ((rep.familles || []).indexOf(f.id) !== -1 ? ' checked' : '') + '>' +
        '<span class="marque" aria-hidden="true"></span><span class="texte">' + esc(f.libelle) +
        '<span class="sous">' + esc(f.detail) + '</span>' +
        (horsPoste ? '<span class="note">Hors barème pour ce poste : cocher ou non ne change pas le score.</span>' : '') +
        '</span></label>';
    });
    html += '</div><div id="demonstration"></div>';
  } else if (question.type === 'criteres') {
    const criteres = criteresDe(question, etat.identite);
    const faits = criteres.filter(function (c) { return rep[c.id]; }).length;
    html += '<p class="enonce">' + esc(question.texte) + '</p>';
    if (question.consigne) html += '<p class="consigne">' + esc(question.consigne) + '</p>';
    html += '<p class="fil"><span>Une réponse par point</span><b><span id="compteVolets">' + faits + '</span> sur ' +
      criteres.length + '</b></p>';
    criteres.forEach(function (critere) {
      html += '<div class="carte volet' + (rep[critere.id] ? ' fait' : '') + '"><h3><span>' + esc(critere.titre) + '</span>' +
        '<span class="badge-fait" aria-hidden="true">' + pic('coche') + '</span></h3>';
      if (critere.texte) html += '<p class="enonce" style="font-size:1.08rem">' + esc(critere.texte) + '</p>';
      html += '<div class="options">';
      critere.options.forEach(function (o) {
        html += optionHtml(question.id + '.' + critere.id, o, rep[critere.id], 'radio');
      });
      html += '</div></div>';
    });
  } else if (question.type === 'variantes') {
    const variante = varianteDe(question, rep) || question.variantes[0];
    html += '<p class="fil"><span>Scénario tiré au hasard</span><b>' + esc(variante.libelle) + '</b></p>';
    html += '<p class="enonce">' + esc(variante.texte) + '</p>';
    if (question.consigne) html += '<p class="consigne">' + esc(question.consigne) + '</p>';
    if (variante.consigne) html += '<p class="consigne">' + esc(variante.consigne) + '</p>';
    html += '<div class="options">';
    variante.options.forEach(function (o) { html += optionHtml(question.id, o, rep.option, 'radio'); });
    html += '</div>';
    html += '<button class="bouton secondaire petit sansImpression" data-retirage="' + esc(question.id) + '">Tirer un autre scénario</button>';
  }

  html += champNote(rep.note);

  $ecran.innerHTML = html;
  const retourLibelle = etat.index ? 'Question précédente' : 'Revenir au texte d’introduction';
  $barre.innerHTML = '<div class="dedans"><div class="rangee">' +
    '<button class="bouton secondaire icone" id="precedent" aria-label="' + retourLibelle + '" title="' + retourLibelle + '">' +
      pic('gauche') + '</button>' +
    '<button class="bouton secondaire" data-aller="sommaire">Sommaire</button>' +
    '<button class="bouton avecPic large" id="suivant">' + (etat.index === total - 1 ? 'Terminer' : 'Suivant') + pic('droite') + '</button>' +
    '</div></div>';

  function surChoix(e) {
    const entree = e.currentTarget;
    const avant = etatQuestion(question);
    const morceaux = entree.getAttribute('name').split('.');
    if (morceaux.length === 2) etat.reponses[morceaux[0]][morceaux[1]] = entree.value;
    else etat.reponses[morceaux[0]].option = entree.value;
    marquerChoix(entree);
    majPastilles();
    planifierSauvegarde();
    if (morceaux.length === 2) avancerVolet(entree.closest('.volet'));
    if (avant !== 'complet' && etatQuestion(question) === 'complet') signalerPret();
  }
  brancher('input[type=radio]', 'change', surChoix);
  brancher('[data-famille]', 'change', function (e) {
    const cible = e.currentTarget.getAttribute('data-famille');
    const reponse = etat.reponses[question.id];
    const liste = reponse.familles || [];
    const position = liste.indexOf(cible);
    if (e.currentTarget.checked && position === -1) liste.push(cible);
    if (!e.currentTarget.checked && position !== -1) liste.splice(position, 1);
    reponse.familles = liste;
    // Décocher la famille de la tâche tirée annule le tirage : la tâche doit venir de ce qu'elle a annoncé.
    if (!e.currentTarget.checked && cible === reponse.famille) { reponse.famille = null; reponse.tache = null; reponse.explication = null; }
    marquerChoix(e.currentTarget);
    rendreDemonstration(question, surChoix);
    majPastilles();
    planifierSauvegarde();
  });
  if (question.type === 'competences') rendreDemonstration(question, surChoix);
  brancher('[data-retirage]', 'click', function (e) {
    const id = e.currentTarget.getAttribute('data-retirage');
    function tirer() {
      tirerVariantes(id);
      rendre();
      annoncer('Nouveau scénario : ' + varianteDe(question, etat.reponses[id]).libelle);
    }
    if (!(etat.reponses[id] || {}).option) { tirer(); return; }
    dialogue({
      titre: 'Tirer un autre scénario ?',
      message: 'La réponse déjà cochée pour ce scénario sera effacée.',
      actions: [
        { id: 'tirer', libelle: 'Tirer un autre scénario' },
        { id: 'garder', libelle: 'Garder ce scénario', style: 'secondaire' }
      ]
    }).then(function (choix) { if (choix === 'tirer') tirer(); });
  });
  brancher('[data-question]', 'click', function (e) {
    const cible = Number(e.currentTarget.getAttribute('data-question'));
    const sens = cible > etat.index ? 'avant' : (cible < etat.index ? 'arriere' : null);
    etat.index = cible;
    rendre(sens);
  });
  brancher('[data-aller]', 'click', function (e) { aller(e.currentTarget.getAttribute('data-aller')); });

  const noteQ = document.getElementById('noteQ');
  if (noteQ) noteQ.addEventListener('input', function () {
    etat.reponses[question.id].note = noteQ.value;
    planifierSauvegarde();
  });
  const repli = $ecran.querySelector('.note-libre');
  if (repli && noteQ) repli.addEventListener('toggle', function () { if (repli.open && !noteQ.value) noteQ.focus(); });

  surClic('precedent', function () {
    if (etat.index === 0) { aller('preambule', 'arriere'); return; }
    etat.index--;
    rendre('arriere');
  });
  surClic('suivant', function () {
    if (etat.index === total - 1) { aller('pratique', 'avant'); return; }
    etat.index++;
    rendre('avant');
  });
}

/* Compétences, second temps : une fois qu'elle a dit ce qu'elle sait faire, une tâche est tirée parmi
   les cochées et elle l'explique. Cette zone se redessine seule quand les cases changent. */
function rendreDemonstration(question, surChoix) {
  const zone = document.getElementById('demonstration');
  if (!zone) return;
  const rep = etat.reponses[question.id];
  const demo = question.demonstration;
  let html = '<div class="carte volet' + (rep.explication ? ' fait' : '') + '"><h3><span>' + esc(demo.titre) + '</span>' +
    '<span class="badge-fait" aria-hidden="true">' + pic('coche') + '</span></h3>';
  if (!(rep.familles || []).length) {
    html += '<p class="petit">Coche d’abord ce qu’elle dit savoir faire : une de ces tâches sera tirée au hasard pour qu’elle te l’explique.</p>';
  } else if (!rep.tache) {
    html += '<p class="petit">Quand elle a fini de dire ce qu’elle sait faire, tire au hasard la tâche qu’elle va t’expliquer.</p>' +
      '<button class="bouton" type="button" id="tirerTache">Tirer la tâche à expliquer</button>';
  } else {
    html += '<p class="fil"><span>Tâche tirée au hasard</span><b>' + esc(rep.tache) + '</b></p>';
    html += '<p class="enonce" style="font-size:1.08rem">' + esc(demo.texte.split('[TACHE]').join(rep.tache)) + '</p>';
    if (demo.consigne) html += '<p class="consigne">' + esc(demo.consigne) + '</p>';
    html += '<div class="options">';
    demo.options.forEach(function (o) { html += optionHtml(question.id + '.explication', o, rep.explication, 'radio'); });
    html += '</div><button class="bouton secondaire petit sansImpression" type="button" id="autreTache">Tirer une autre tâche</button>';
  }
  zone.innerHTML = html + '</div>';
  zone.querySelectorAll('input[type=radio]').forEach(function (n) { n.addEventListener('change', surChoix); });

  function tirer(autre) {
    tirerTache(question, autre);
    rendreDemonstration(question, surChoix);
    majPastilles();
    planifierSauvegarde();
    defilerVers(zone);
  }
  surClic('tirerTache', function () { tirer(false); });
  surClic('autreTache', function () {
    if (!rep.explication) { tirer(true); return; }
    dialogue({
      titre: 'Tirer une autre tâche ?',
      message: 'La réponse déjà cochée pour « ' + rep.tache + ' » sera effacée.',
      actions: [
        { id: 'tirer', libelle: 'Tirer une autre tâche' },
        { id: 'garder', libelle: 'Garder cette tâche', style: 'secondaire' }
      ]
    }).then(function (choix) { if (choix === 'tirer') tirer(true); });
  });
}

/* Questions à plusieurs points (hygiène, disponibilité) : quand un point reçoit sa première réponse,
   l'écran descend tout seul vers le point suivant encore sans réponse. Corriger une réponse ne fait pas bouger l'écran. */
function avancerVolet(volet) {
  if (!volet || volet.classList.contains('fait')) return;
  volet.classList.add('fait');
  const compte = document.getElementById('compteVolets');
  if (compte) compte.textContent = $ecran.querySelectorAll('.volet.fait').length;
  const volets = Array.prototype.slice.call($ecran.querySelectorAll('.volet'));
  const suivant = volets.slice(volets.indexOf(volet) + 1).filter(function (v) { return !v.classList.contains('fait'); })[0];
  if (suivant) setTimeout(function () { defilerVers(suivant); }, 280);
}

function defilerVers(noeud) {
  if (!noeud || !document.body.contains(noeud)) return;
  const haut = noeud.getBoundingClientRect().top + (pageYOffset || 0) - 10;
  try { scrollTo({ top: haut, behavior: mouvementReduit() ? 'auto' : 'smooth' }); } catch (e) { scrollTo(0, haut); }
}

/* La question est complète : le bouton Suivant s'éclaire une fois, sans rien imposer. */
function signalerPret() {
  const bouton = document.getElementById('suivant');
  if (!bouton) return;
  bouton.classList.remove('pret');
  void bouton.offsetWidth;
  bouton.classList.add('pret');
}

function majPastilles() {
  $ecran.querySelectorAll('[data-question]').forEach(function (n) {
    const q = CONFIG.questions[Number(n.getAttribute('data-question'))];
    n.className = 'pastille ' + etatQuestion(q) + (CONFIG.questions[etat.index] === q ? ' courant' : '');
  });
}

/* ---------- Épreuve pratique ---------- */

/* ---------- Résultat ---------- */

/* Seuls le poste, les options cochées et l'épreuve pratique sont transmis au barème.
   Les renseignements de l'écran d'accueil (prénom, note libre) ne sont jamais passés,
   et les notes libres écrites question par question sont retirées avant l'appel :
   elles peuvent contenir des éléments de vie privée, qui n'ont rien à faire dans le calcul. */
function construireAnswers() {
  const reponses = {};
  Object.keys(etat.reponses).forEach(function (q) {
    const source = etat.reponses[q] || {};
    const copie = {};
    Object.keys(source).forEach(function (cle) {
      if (cle === 'note') return;
      copie[cle] = JSON.parse(JSON.stringify(source[cle]));
    });
    reponses[q] = copie;
  });
  return {
    poste: etat.identite.poste,
    logement: etat.identite.logement,
    reponses: reponses,
    pratique: etat.pratiqueFaite ? JSON.parse(JSON.stringify(etat.pratique)) : {}
  };
}

function questionsIncompletes() {
  return CONFIG.questions.filter(function (q) { return etatQuestion(q) !== 'complet'; });
}
function questionsSansReponse() {
  return questionsIncompletes().map(function (q) { return q.sujet.charAt(0).toLowerCase() + q.sujet.slice(1); });
}
function allerAQuestion(question) {
  etat.index = Math.max(0, CONFIG.questions.indexOf(question));
  aller('entretien');
}

/* Avant le calcul : une question oubliée se rattrape plus facilement maintenant que devant le résultat. */
function demanderResultat() {
  const manquantes = questionsIncompletes();
  if (!manquantes.length) { calculerEtAfficher(); return; }
  const plusieurs = manquantes.length > 1;
  dialogue({
    titre: plusieurs ? 'Il reste ' + manquantes.length + ' questions sans réponse complète' : 'Il reste une question sans réponse complète',
    message: (plusieurs ? 'Elles seront retirées' : 'Elle sera retirée') + ' du calcul si tu affiches le résultat maintenant :',
    liste: manquantes.map(function (q) { return q.titre; }),
    actions: [
      { id: 'completer', libelle: plusieurs ? 'Les compléter' : 'La compléter' },
      { id: 'voir', libelle: 'Voir le résultat quand même', style: 'secondaire' }
    ]
  }).then(function (choix) {
    if (choix === 'completer') allerAQuestion(manquantes[0]);
    else if (choix === 'voir') calculerEtAfficher();
  });
}

function calculerEtAfficher() {
  etat.resultat = computeScore(construireAnswers(), CONFIG);
  etat.enregistre = false;
  effacerBrouillon();
  aller('resultat');
}

function detailReponses() {
  let html = '<dl>';
  CONFIG.questions.forEach(function (q) {
    const rep = etat.reponses[q.id] || {};
    html += '<dt data-theme="' + esc(q.couleur) + '">' + pic(q.icone) + esc(q.titre) + '</dt>' +
      '<dd><span class="sujet">' + esc(q.sujet) + '</span>';
    if (q.type === 'competences') {
      const noms = q.familles.filter(function (f) { return (rep.familles || []).indexOf(f.id) !== -1; })
        .map(function (f) { return f.libelle; });
      html += noms.length ? 'Elle dit savoir faire : ' + esc(noms.join(', ')) + '.' : 'Elle n\u2019a rien coché.';
      if (rep.tache) {
        html += '<br>Tâche à expliquer : ' + esc(rep.tache) + '. ' +
          esc(libelleOption(q.demonstration.options, rep.explication) || 'Pas de réponse cochée') + '.';
      }
    } else if (q.type === 'criteres') {
      html += criteresDe(q, etat.identite).map(function (c) {
        return esc(c.titre) + ' : ' + esc(libelleOption(c.options, rep[c.id]) || 'pas de réponse cochée');
      }).join('<br>');
    } else if (q.type === 'variantes') {
      const variante = varianteDe(q, rep);
      if (variante) html += 'Scénario « ' + esc(variante.libelle) + ' ». ';
      html += esc(libelleOption(variante ? variante.options : [], rep.option) || 'Pas de réponse cochée') + '.';
    }
    if (rep.note) html += '<br><small>Ce qu\u2019elle a dit : ' + esc(rep.note) + '</small>';
    html += '</dd>';
  });
  return html + '</dl>';
}

    html += '<div class="encadre info"><b>Ces questions n\u2019ont pas reçu de réponse complète et sont retirées du calcul :</b> ' +

  }

        '<span class="message">' + esc(d.message) + '</span></div></div>';

      : '<button class="bouton secondaire avecPic" id="enregistrer">' + pic('archive') + 'Enregistrer sur ce téléphone</button>') +

    '<button class="bouton secondaire avecPic" id="imprimer">' + pic('imprimer') + 'Imprimer</button>' +

  surClic('completer', function () { allerAQuestion(questionsIncompletes()[0]); });

  }
  surClic('nouveau', function () {

    dialogue({

      actions: [

        { id: 'annuler', libelle: 'Annuler', style: 'secondaire' }

    }).then(function (choix) {
      if (choix === 'enregistrer' && enregistrerHistorique()) nouvelEntretien();
      else if (choix === 'perdre') nouvelEntretien();
    });
  });
}

/* L'anneau se remplit, le score monte et les jauges s'allongent jusqu'à leur valeur.
   Rien ne bouge si le téléphone demande moins de mouvement : les valeurs finales sont déjà dans la page. */
function animerResultat() {
  if (mouvementReduit() || typeof requestAnimationFrame !== 'function') return;
  const cercle = $ecran.querySelector('.anneau .progres');
  const valeur = $ecran.querySelector('.anneau .valeur');
  const jauges = Array.prototype.slice.call($ecran.querySelectorAll('.jauge i'));
  if (!cercle || !valeur) return;
  const final = cercle.getAttribute('stroke-dasharray');
  const cible = Number(valeur.textContent) || 0;
  const largeurs = jauges.map(function (j) { return j.style.width; });
  const duree = 900;

  cercle.style.strokeDasharray = '0 ' + final.split(' ')[1];
  jauges.forEach(function (j) { j.style.width = '0'; });
  valeur.textContent = '0';

  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      cercle.style.transition = 'stroke-dasharray ' + duree + 'ms cubic-bezier(.2,.7,.3,1)';
      cercle.style.strokeDasharray = final;
      jauges.forEach(function (j, i) { j.style.width = largeurs[i]; });
    });
  });
  const debut = Date.now();
  (function compter() {
    const avance = Math.min(1, (Date.now() - debut) / duree);
    valeur.textContent = String(Math.round(cible * (1 - Math.pow(1 - avance, 3))));
    if (avance < 1) requestAnimationFrame(compter);
  })();
}

/* ---------- Exports ---------- */

function nomFichier(extension) {
  const prenom = (etat.identite.prenom || 'candidate')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'candidate';
  return 'entretien-' + prenom + '-' + (etat.identite.date || aujourdhui()) + '.' + extension;
}

function telecharger(nom, contenu, type) {
  try {
    const blob = new Blob([contenu], { type: type + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const lien = document.createElement('a');
    lien.href = url;
    lien.download = nom;
    document.body.appendChild(lien);
    lien.click();
    document.body.removeChild(lien);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    annoncer('Fichier ' + nom + ' téléchargé');
  } catch (e) {
    prevenir('Le téléchargement a échoué', 'Ce téléphone refuse le téléchargement. Utilise « Imprimer » pour garder une trace.');
  }
}

function enregistrementComplet() {
  if (etat.archive) return etat.archive;
  return {
    version: CONFIG.version,
    identite: etat.identite,
    poste: etat.identite.poste,
    reponses: etat.reponses,
    pratique: etat.pratiqueFaite ? etat.pratique : null,
    resultat: etat.resultat
  };
}

function exporterJson() {
  telecharger(nomFichier('json'), JSON.stringify(enregistrementComplet(), null, 2), 'application/json');
}

function celluleCsv(valeur) {
  const texte = String(valeur === null || valeur === undefined ? '' : valeur);
  return /[;"\n\r]/.test(texte) ? '"' + texte.replace(/"/g, '""') + '"' : texte;
}

function exporterCsv() {
  const r = etat.resultat;
  const lignes = [['champ', 'valeur']];
  lignes.push(['prenom', etat.identite.prenom]);
  lignes.push(['date', etat.identite.date]);
  lignes.push(['poste', etat.identite.poste]);
  lignes.push(['logement', etat.identite.logement]);
  lignes.push(['total', r.total]);
  lignes.push(['verdict', r.verdict]);
  CONFIG.sousScores.forEach(function (s) { lignes.push(['sous_score_' + s.id, r.sousScores[s.id]]); });
  lignes.push(['drapeaux', r.drapeaux.map(function (d) { return d.niveau + ':' + d.id; }).join(' | ')]);
  lignes.push(['points_a_verifier', r.pointsAVerifier.join(' | ')]);
  // Un entretien de l'ancienne version n'a pas les mêmes questions : seul son résultat passe dans le CSV.
  (etat.archive ? [] : CONFIG.questions).forEach(function (q) {
    const rep = etat.reponses[q.id] || {};
    let valeur = '';
    if (q.type === 'competences') {
      valeur = (rep.familles || []).join(' | ');
      if (rep.tache) lignes.push([q.id + '_tache', rep.tache + ' : ' + (rep.explication || '')]);
    } else if (q.type === 'criteres') {
      valeur = criteresDe(q, etat.identite).map(function (c) { return c.id + '=' + (rep[c.id] || ''); }).join(' | ');
    } else valeur = (rep.variante ? rep.variante + ':' : '') + (rep.option || '');
    lignes.push([q.id, valeur]);
    if (rep.note) lignes.push([q.id + '_note', rep.note]);
  });
  if (etat.pratiqueFaite) {
    CONFIG.pratique.gestes.forEach(function (g) { lignes.push(['pratique_' + g.id, etat.pratique[g.id] || 'non_observe']); });
  }
  lignes.push(['note_libre', etat.identite.note]);
  telecharger(nomFichier('csv'), '﻿' + lignes.map(function (l) { return l.map(celluleCsv).join(';'); }).join('\r\n'), 'text/csv');
}

/* ---------- Historique ---------- */

/* Renvoie true si l'entretien est (déjà) dans l'historique. Un second appui n'ajoute pas de doublon. */
function enregistrerHistorique() {
  if (etat.enregistre) return true;
  const liste = lireStockage(CLES.historique, []);
  liste.unshift(Object.assign({ enregistreLe: new Date().toISOString() }, enregistrementComplet()));
  if (!ecrireStockage(CLES.historique, liste.slice(0, 50))) {
    prevenir('Impossible d’enregistrer', 'Ce téléphone refuse de garder l’entretien. Utilise l’export ou l’impression pour en garder une trace.');
    return false;
  }
  etat.enregistre = true;
  const bouton = document.getElementById('enregistrer');
  if (bouton) {
    bouton.disabled = true;
    bouton.classList.add('fait');
    bouton.innerHTML = pic('coche') + 'Enregistré sur ce téléphone';
  }
  annoncer('Entretien enregistré dans l’historique');
  return true;
}

/* Entretiens enregistrés avec la version 1 (dix questions, verdict « essai ») : leur résultat reste lisible. */
const VERDICTS_ANCIENS = { essai: 'recommande' };
function verdictActuel(verdict) { return VERDICTS_ANCIENS[verdict] || verdict; }
function estAncienneVersion(item) {
  return String((item && item.version) || '1').split('.')[0] !== CONFIG.version.split('.')[0];
}

function compterDrapeaux(n) {
  return n === 0 ? 'aucun drapeau' : (n === 1 ? '1 drapeau' : n + ' drapeaux');
}

function rendreHistorique() {
  const liste = lireStockage(CLES.historique, []);
  let html = '<h1>Historique</h1>';
  if (!stockageDisponible()) {
    html += '<p class="encadre">Le stockage local n’est pas disponible sur ce navigateur. L’app reste utilisable, mais rien n’est gardé.</p>';
  }
  html += '<p>Les entretiens enregistrés restent sur ce téléphone. Personne d’autre n’y a accès.</p>';
  if (!liste.length) html += '<p>Aucun entretien enregistré.</p>';
  else {
    html += '<ul class="liste">';
    liste.forEach(function (item, position) {
      const res = item.resultat || {};
      html += '<li><div class="fil"><b>' + esc((item.identite || {}).prenom || 'Candidate') + '</b>' +
        '<span class="chip ' + esc(verdictActuel(res.verdict) || 'vide') + '">' + esc(res.total != null ? res.total + '/100' : '—') + '</span></div>' +
        '<p class="petit">' + esc(dateLisible((item.identite || {}).date)) + ' — ' + esc(libellePoste(item.poste)) +
        ' — ' + compterDrapeaux((res.drapeaux || []).length) + '</p>' +
        '<button class="bouton secondaire petit" data-ouvrir="' + position + '">Ouvrir</button></li>';
    });
    html += '</ul><button class="bouton danger" id="effacer">Effacer l’historique</button>';
  }

  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><button class="bouton secondaire" data-aller="accueil">Retour</button></div>';

  brancher('[data-ouvrir]', 'click', function (e) {
    const item = liste[Number(e.currentTarget.getAttribute('data-ouvrir'))];
    if (!item) return;
    etat = etatInitial();
    etat.identite = Object.assign(etat.identite, item.identite || {});
    etat.enregistre = true;
    if (estAncienneVersion(item)) {
      // Ses réponses ne correspondent plus aux questions actuelles : on garde son résultat tel quel.
      if (!item.resultat) return;
      etat.archive = item;
      etat.resultat = Object.assign({}, item.resultat, { verdict: verdictActuel(item.resultat.verdict) });
    } else {
      etat.reponses = Object.assign(etat.reponses, item.reponses || {});
      etat.pratique = item.pratique || {};
      etat.pratiqueFaite = !!item.pratique;
      etat.resultat = item.resultat || computeScore(construireAnswers(), CONFIG);
    }
    aller('resultat');
  });
  brancher('[data-aller]', 'click', function (e) { aller(e.currentTarget.getAttribute('data-aller')); });
  surClic('effacer', function () {
    dialogue({
      titre: 'Effacer tout l’historique ?',
      message: 'Les ' + liste.length + ' entretiens enregistrés sur ce téléphone seront supprimés. C’est définitif.',
      actions: [
        { id: 'effacer', libelle: 'Effacer l’historique', style: 'danger' },
        { id: 'garder', libelle: 'Le garder', style: 'secondaire' }
      ]
    }).then(function (choix) {
      if (choix !== 'effacer') return;
      ecrireStockage(CLES.historique, []);
      rendre();
      annoncer('Historique effacé');
    });
  });
}

/* ---------- Réglages ---------- */

function rendreReglages() {
  let html = '<h1>Réglages</h1>';

  html += '<div class="carte"><h3>Affichage</h3>' +
    '<p class="petit">Le mode plein soleil agrandit le texte et renforce les contrastes, pour lire dehors.</p>' +
    '<button class="bouton secondaire" id="bascule">' +
      (affichage.contraste === 'fort' ? 'Revenir à l’affichage normal' : 'Activer le mode plein soleil') + '</button></div>';

  html += '<div class="carte"><h3>Seuils du verdict</h3><table><tr><th>Verdict</th><th>Score</th></tr>' +
    '<tr><td>' + esc(CONFIG.verdicts.recommande.libelle) + '</td><td>' + CONFIG.seuils.recommande + ' et plus</td></tr>' +
    '<tr><td>' + esc(CONFIG.verdicts.approfondir.libelle) + '</td><td>' + CONFIG.seuils.approfondir + ' à ' + (CONFIG.seuils.recommande - 1) + '</td></tr>' +
    '<tr><td>' + esc(CONFIG.verdicts.non_recommande.libelle) + '</td><td>moins de ' + CONFIG.seuils.approfondir + '</td></tr></table>' +
    '<p class="petit"><b>Plafonnement :</b> 1 drapeau bloquant → au mieux « à approfondir ». ' +
    CONFIG.plafonnement.bloquantsNonRecommande + ' bloquants ou plus → « non recommandé ». ' +
    CONFIG.plafonnement.legersApprofondir + ' drapeaux légers ou plus → au mieux « à approfondir ».</p>' +
    '<p class="petit">Valeurs de départ, à recalibrer après une quinzaine d’entretiens réels.</p></div>';

  html += '<div class="carte"><h3>Pondérations par poste</h3><table><tr><th>Poste</th>' +
    CONFIG.sousScores.map(function (s) { return '<th>' + esc(s.libelle) + '</th>'; }).join('') + '</tr>';
  CONFIG.postes.forEach(function (p) {
    html += '<tr><td>' + esc(p.libelle) + '</td>' +
      CONFIG.sousScores.map(function (s) { return '<td>' + CONFIG.ponderations[p.id][s.id] + '</td>'; }).join('') + '</tr>';
  });
  html += '</table></div>';

  html += '<div class="carte plate"><h3>Vérification du barème</h3>' +
    '<p class="petit">Ouvre <code>index.html?selftest=1</code> pour lancer les tests du barème dans ce navigateur.</p>' +
    '<p class="petit">Version du barème : ' + esc(CONFIG.version) + '</p></div>';

  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><button class="bouton secondaire" data-aller="accueil">Retour</button></div>';

  surClic('bascule', function () {
    affichage.contraste = affichage.contraste === 'fort' ? 'normal' : 'fort';
    ecrireStockage(CLES.affichage, affichage);
    rendre();
  });
  brancher('[data-aller]', 'click', function (e) { aller(e.currentTarget.getAttribute('data-aller')); });
}

/* ---------- Mode ?selftest=1 ---------- */

function executerTests() {
  const SOUS_SCORES = CONFIG.sousScores.map(function (s) { return s.id; });
  const FAUSSES_DONNEES = [
    { situationFamiliale: 'mariée, mari au village', nationalite: 'béninoise', langueEntretien: 'zarma', religion: 'A', ethnie: 'X' },
    { situationFamiliale: 'célibataire', nationalite: 'togolaise', langueEntretien: 'haoussa', religion: 'B', ethnie: 'Y' }
  ];
  const resume = function (r) {
    return JSON.stringify({
      total: r.total, sousScores: r.sousScores, verdict: r.verdict,
      drapeaux: r.drapeaux.map(function (d) { return d.niveau + ':' + d.id; }).sort()
    });
  };
  return TEST_CASES.map(function (tc) {
    const erreurs = [];
    let r = null;
    try { r = computeScore(JSON.parse(JSON.stringify(tc.answers)), CONFIG); }
    catch (e) { return { nom: tc.name, erreurs: ['exception : ' + e.message] }; }

    if (!Number.isInteger(r.total) || r.total < 0 || r.total > 100) erreurs.push('total hors [0, 100]');
    SOUS_SCORES.forEach(function (k) {
      const v = r.sousScores[k];
      if (typeof v !== 'number' || v < 0 || v > 100) erreurs.push('sousScores.' + k + ' invalide');
    });
    if (!Array.isArray(r.drapeaux)) erreurs.push('drapeaux doit être un tableau');
    if (!Array.isArray(r.pointsAVerifier)) erreurs.push('pointsAVerifier doit être un tableau');

    const attendu = tc.expect || {};
    const ids = r.drapeaux.map(function (d) { return d.id; });
    if (attendu.verdict && r.verdict !== attendu.verdict) erreurs.push('verdict « ' + r.verdict + ' » au lieu de « ' + attendu.verdict + ' »');
    if (attendu.minTotal != null && r.total < attendu.minTotal) erreurs.push('total ' + r.total + ' < ' + attendu.minTotal);
    if (attendu.maxTotal != null && r.total > attendu.maxTotal) erreurs.push('total ' + r.total + ' > ' + attendu.maxTotal);
    (attendu.drapeauxInclus || []).forEach(function (id) { if (ids.indexOf(id) === -1) erreurs.push('drapeau manquant : ' + id); });
    (attendu.drapeauxExclus || []).forEach(function (id) { if (ids.indexOf(id) !== -1) erreurs.push('drapeau inattendu : ' + id); });
    (attendu.pointsInclus || []).forEach(function (texte) {
      const present = r.pointsAVerifier.some(function (p) { return p.indexOf(texte) !== -1; });
      if (!present) erreurs.push('point à vérifier manquant : « ' + texte + ' »');
    });

    let bloquants = 0, legers = 0;
    r.drapeaux.forEach(function (d) { if (d.niveau === 'bloquant') bloquants++; else legers++; });
    if (bloquants >= 2 && r.verdict !== 'non_recommande') erreurs.push('plafonnement non appliqué (2 bloquants)');
    if ((bloquants === 1 || legers >= 3) && r.verdict === 'recommande') erreurs.push('plafonnement non appliqué');

    const reference = resume(r);
    FAUSSES_DONNEES.forEach(function (fausses) {
      const a = Object.assign(JSON.parse(JSON.stringify(tc.answers)), fausses);
      if (resume(computeScore(a, CONFIG)) !== reference) erreurs.push('le résultat change avec des données personnelles (équité)');
    });

    return { nom: tc.name, erreurs: erreurs, resultat: r };
  });
}

function rendreSelftest() {
  const resultats = executerTests();
  const echecs = resultats.filter(function (x) { return x.erreurs.length; });
  let html = '<h1>Auto-test du barème</h1>';
  html += '<p class="' + (echecs.length ? 'ko' : 'ok') + '">' +
    (echecs.length ? '✗ ' + echecs.length + ' échec(s) sur ' + resultats.length + ' cas'
                   : '✓ Tout est vert — ' + resultats.length + ' cas') + '</p>';
  resultats.forEach(function (x) {
    html += '<div class="carte"><b class="' + (x.erreurs.length ? 'ko' : 'ok') + '">' +
      (x.erreurs.length ? '✗' : '✓') + ' ' + esc(x.nom) + '</b>';
    if (x.resultat) {
      html += '<p class="petit">' + esc(x.resultat.verdict) + ' — ' + x.resultat.total + '/100 — drapeaux : ' +
        esc(x.resultat.drapeaux.map(function (d) { return d.niveau + ':' + d.id; }).join(', ') || 'aucun') + '</p>';
    }
    if (x.erreurs.length) html += '<pre>' + esc(x.erreurs.join('\n')) + '</pre>';
    html += '</div>';
  });
  $ecran.innerHTML = html;
  $barre.innerHTML = '<div class="dedans"><a class="bouton" href="index.html">Retour à l’app</a></div>';
}

/* ---------- Démarrage ---------- */

(function demarrer() {
  // Clés de la version 1 devenues inutiles : brouillon à dix questions, nom du produit fictif.
  ['rem.brouillon.v1', 'rem.reglages.v1'].forEach(function (cle) {
    try { localStorage.removeItem(cle); } catch (e) { /* stockage indisponible : rien à nettoyer */ }
  });
  appliquerAffichage();
  const soleil = document.getElementById('soleil');
  if (soleil) soleil.addEventListener('click', function () {
    affichage.contraste = affichage.contraste === 'fort' ? 'normal' : 'fort';
    ecrireStockage(CLES.affichage, affichage);
    appliquerAffichage();
  });

  try {
    addEventListener('beforeprint', function () {
      document.querySelectorAll('details').forEach(function (d) { d.open = true; });
      if (etat.ecran === 'resultat' && etat.resultat) {
        const valeur = $ecran.querySelector('.anneau .valeur');
        if (valeur) valeur.textContent = String(etat.resultat.total);
      }
    });
  } catch (e) { /* sans effet hors navigateur */ }

  let selftest = false;
  try { selftest = /(?:^|[?&])selftest=1(?:&|$)/.test(location.search); } catch (e) { selftest = false; }
  if (selftest) { rendreSelftest(); appliquerAffichage(); return; }
  rendre();
})();
</script>
